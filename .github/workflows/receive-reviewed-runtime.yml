name: Receive reviewed runtime (temporary)
'on':
  push:
    branches:
    - main
    paths:
    - .github/runtime-transfer/request.json
  workflow_dispatch: null
permissions: {}
concurrency:
  group: receive-reviewed-runtime
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'haibaratou/etymolingo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # ONE_SHOT_WRITE
    outputs:
      published_sha: ${{ steps.commit.outputs.sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        filter: blob:none
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: tests/explorer-dom/package-lock.json
    - name: Prepare bounded public root guard 1
      shell: bash
      run: 'set -euo pipefail

        cat > "$RUNNER_TEMP/rootguard.b64" <<''ROOTCHUNK0''

        

        ROOTCHUNK0

        '
    - name: Prepare bounded public root guard 2
      shell: bash
      run: 'set -euo pipefail

        cat >> "$RUNNER_TEMP/rootguard.b64" <<''ROOTCHUNK1''

        

        ROOTCHUNK1

        '
    - name: Prepare bounded public root guard 3
      shell: bash
      run: 'set -euo pipefail

        cat >> "$RUNNER_TEMP/rootguard.b64" <<''ROOTCHUNK2''

        

        ROOTCHUNK2

        '
    - name: Prepare bounded public root guard 4
      shell: bash
      run: 'set -euo pipefail

        cat >> "$RUNNER_TEMP/rootguard.b64" <<''ROOTCHUNK3''

        

        ROOTCHUNK3

        '
    - name: Prepare bounded public root guard 5
      shell: bash
      run: 'set -euo pipefail

        cat >> "$RUNNER_TEMP/rootguard.b64" <<''ROOTCHUNK4''

        

        ROOTCHUNK4

        '
    - name: Prepare bounded public root guard 6
      shell: bash
      run: 'set -euo pipefail

        cat >> "$RUNNER_TEMP/rootguard.b64" <<''ROOTCHUNK5''

        

        ROOTCHUNK5

        '
    - name: Prepare bounded public root guard 7
      shell: bash
      run: 'set -euo pipefail

        cat >> "$RUNNER_TEMP/rootguard.b64" <<''ROOTCHUNK6''

        

        ROOTCHUNK6

        '
    - name: Prepare bounded public root guard 8
      shell: bash
      run: 'set -euo pipefail

        cat >> "$RUNNER_TEMP/rootguard.b64" <<''ROOTCHUNK7''

        

        ROOTCHUNK7

        '
    - name: Prepare bounded public root guard 9
      shell: bash
      run: 'set -euo pipefail

        cat >> "$RUNNER_TEMP/rootguard.b64" <<''ROOTCHUNK8''

        

        ROOTCHUNK8

        '
    - name: Prepare bounded public root guard 10
      shell: bash
      run: 'set -euo pipefail

        cat >> "$RUNNER_TEMP/rootguard.b64" <<''ROOTCHUNK9''

        

        ROOTCHUNK9

        '
    - name: Prepare bounded public root guard 11
      shell: bash
      run: 'set -euo pipefail

        cat >> "$RUNNER_TEMP/rootguard.b64" <<''ROOTCHUNK10''

        

        ROOTCHUNK10

        '
    - name: Verify exact public root guard module
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PYVERIFY''

        import base64,hashlib,os,pathlib

        p=pathlib.Path(os.environ[''RUNNER_TEMP''])

        raw=base64.b64decode(b''''.join((p/''rootguard.b64'').read_bytes().split()),validate=True)

        assert hashlib.sha256(raw).hexdigest()==''627e34e68e510c8fbfef7899347e25d6cba5b4728b17df097f1e7c314f5d709a''

        (p/''root_publication_guard.py'').write_bytes(raw)

        PYVERIFY

        '
    - name: Verify and stage pinned runtime-only payload
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/receive-runtime.py\" <<'PYRECEIVER'\n\"\"\"One-shot runtime receiver.\
        \ Never consume private diagnostic artifacts.\"\"\"\nimport base64, datetime, hashlib, io, json, os, pathlib, re,\
        \ stat, subprocess, zipfile\nfrom root_publication_guard import validate_root_publication,validate_embedded_roots\n\
        DEADLINE='2026-10-31T13:20:00+00:00'\nCONTROL='.github/runtime-transfer/'\nWORKFLOW='.github/workflows/receive-reviewed-runtime.yml'\n\
        EXACT={'app/vocabulary-master.html','assets/word/illustration-index.js','app/licenses/pronunciation.html',*('app/shared/'+n+'.js'\
        \ for n in ['verb-inflections','nominal-adjective-inflections','explorer-inflections','offline-dictionary','illustration-scenes','explorer-difficulty-v2','lexical-identity','semantic-classifications','spelling-puzzle-eligibility','multilingual-answers'])}\n\
        NAMES=set('roots.json words.json affixes.json word_block.json details_brief.json eo_slugs.json eo_pick.json manifest.json\
        \ word-parts.json word-parts-supplement.json word-parts-supplement.js multilingual-answers.json illustration-scenes.json\
        \ illustration-review-status.js illustration-review-status.json word-suika-words.json semantic-classifications.json\
        \ semantic-classifications.js etymological-components.js etymology-origins.js etymology-origins.json word-review-notes.js\
        \ offline-dictionary.js lexical-profiles.js weblio-learning-levels.js puzzle-visual-scores.js us-pronunciations.js'.split())\n\
        def sha(raw): return hashlib.sha256(raw).hexdigest()\ndef blob(raw): return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\\\
        0'+raw).hexdigest()\ndef allowed(p):\n    if not isinstance(p,str) or '\\\\' in p or any(x in ('','.','..') for x\
        \ in p.split('/')): return False\n    if p in EXACT:return True\n    prefix='app/data/generated-etymon/'\n    if not\
        \ p.startswith(prefix):return False\n    n=p[len(prefix):]\n    return n in NAMES or bool(re.fullmatch(r'(?:det|eo)/[A-Za-z0-9_-]+\\\
        .json',n)) or bool(re.fullmatch(r'offline-dictionary-part-[a-f0-9]+-[0-9]+\\.js',n))\ndef check_time(now=None):\n\
        \    now=now or datetime.datetime.now(datetime.timezone.utc)\n    if now>=datetime.datetime.fromisoformat(DEADLINE):raise\
        \ ValueError('Authorization window expired')\ndef git(*args):return subprocess.check_output(['git',*args])\ndef read_blob(ref,p):\n\
        \    r=subprocess.run(['git','rev-parse','--verify',ref+':'+p],capture_output=True,text=True)\n    return r.stdout.strip()\
        \ if r.returncode==0 else None\n\ndef validate_archive(manifest,raw):\n    required={'schema','public_repository','public_base_sha','archive_sha256','archive_bytes','files'}\n\
        \    if set(manifest)!=required or manifest['schema']!=2:raise ValueError('Manifest schema')\n    if manifest['public_repository']!='haibaratou/etymolingo':raise\
        \ ValueError('Repository mismatch')\n    for field in ('public_base_sha',):\n        if not re.fullmatch('[0-9a-f]{40}',manifest[field]):raise\
        \ ValueError('Commit mismatch')\n    if len(raw)!=manifest['archive_bytes'] or sha(raw)!=manifest['archive_sha256']:raise\
        \ ValueError('Archive digest')\n    if len(raw)>200_000_000:raise ValueError('Archive too large')\n    entries=manifest['files']\n\
        \    if not isinstance(entries,list) or not entries or len(entries)>10000:raise ValueError('File count')\n    names=[r['path']\
        \ for r in entries]\n    if len(names)!=len(set(names)) or not all(map(allowed,names)):raise ValueError('Unsafe path\
        \ or duplicate')\n    # Deletions require a separately reviewed operation, never infer them from a generated diff.\n\
        \    if any(r.get('operation')!='write' for r in entries):raise ValueError('Deletion not approved')\n    result={}\n\
        \    with zipfile.ZipFile(io.BytesIO(raw)) as z:\n        infos=z.infolist()\n        if len(infos)!=len(names) or\
        \ set(i.filename for i in infos)!=set(names):raise ValueError('ZIP membership')\n        if sum(i.file_size for i\
        \ in infos)>700_000_000:raise ValueError('Expanded size')\n        for info in infos:\n            if info.is_dir()\
        \ or stat.S_ISLNK(info.external_attr>>16) or info.flag_bits&1:raise ValueError('ZIP entry type')\n            row=entries[names.index(info.filename)]\n\
        \            if set(row)!={'path','operation','before_blob','bytes','sha256','blob','mode'} or row['mode']!='100644':raise\
        \ ValueError('File metadata')\n            before=row['before_blob']\n            if before is not None and not re.fullmatch('[0-9a-f]{40}',before):raise\
        \ ValueError('Before blob')\n            if info.file_size!=row['bytes'] or info.file_size>=100_000_000:raise ValueError('File\
        \ length')\n            data=z.read(info)\n            if sha(data)!=row['sha256'] or blob(data)!=row['blob']:raise\
        \ ValueError('File digest')\n            data.decode('utf-8')\n            if b'-----BEGIN PRIVATE KEY-----' in data\
        \ or re.search(rb'gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}',data):raise ValueError('Credential marker')\n\
        \            if b'runtime-PRIVATE-diagnostic' in data or re.search(rb'\"private_only\"\\s*:\\s*true',data):raise ValueError('Private\
        \ diagnostic marker')\n            result[info.filename]=data\n    return result\n\ndef verify_public_quotations(manifest,data,run_git):\n\
        \    \"\"\"Used BEFORE public upload as well as in the receiver.\"\"\"\n    base=manifest['public_base_sha']\n   \
        \ for folder in ('det','eo'):\n        prefix='app/data/generated-etymon/'+folder+'/'\n        if not any(p.startswith(prefix)\
        \ for p in data):continue\n        old=set()\n        for p in run_git('ls-tree','-r','--name-only',base,'--',prefix).decode().splitlines():\n\
        \            if p.endswith('.json'):\n                old.update(json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':'))\
        \ for v in json.loads(run_git('show',base+':'+p)).values())\n        for p,raw in data.items():\n            if p.startswith(prefix):\n\
        \                if any(json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':')) not in old for v in json.loads(raw).values()):raise\
        \ ValueError('New private quotation')\n\ndef verify_root_payloads(manifest,data,run_git):\n    roots_path='app/data/generated-etymon/roots.json';html_path='app/vocabulary-master.html'\n\
        \    if roots_path not in data and html_path not in data:return None\n    base=manifest['public_base_sha']\n    def\
        \ effective(path):\n        if path in data:return data[path]\n        return run_git('show',base+':'+path)\n    baseline=json.loads(run_git('show',base+':'+roots_path))\n\
        \    roots=json.loads(effective(roots_path))\n    result=validate_root_publication(roots,baseline_roots=baseline)\n\
        \    validate_embedded_roots(effective(html_path),roots,read_runtime_file=effective)\n    return result\n\ndef main():\n\
        \    check_time()\n    if os.environ.get('GITHUB_REPOSITORY')!='haibaratou/etymolingo' or os.environ.get('GITHUB_REF')!='refs/heads/main':raise\
        \ ValueError('Wrong target')\n    root=pathlib.Path.cwd().resolve()\n    if git('status','--porcelain').strip():raise\
        \ ValueError('Dirty checkout')\n    if pathlib.Path(CONTROL).is_symlink() or any(not p.is_file() or p.is_symlink()\
        \ for p in pathlib.Path(CONTROL).iterdir()):raise ValueError('Unsafe transfer files')\n    req=json.loads(pathlib.Path(CONTROL+'request.json').read_text())\n\
        \    if set(req)!={'schema','manifest_sha256','chunks','expires_utc'} or req['schema']!=1 or req['expires_utc']!=DEADLINE:raise\
        \ ValueError('Request schema')\n    mb=pathlib.Path(CONTROL+'manifest.json').read_bytes()\n    if sha(mb)!=req['manifest_sha256']:raise\
        \ ValueError('Manifest pin')\n    m=json.loads(mb)\n    chunks=req['chunks']\n    if not isinstance(chunks,list) or\
        \ not 1<=len(chunks)<=300:raise ValueError('Chunk count')\n    parts=[]\n    expected={CONTROL+'request.json',CONTROL+'manifest.json'}|{CONTROL+f'payload-{i:04d}.b64'\
        \ for i in range(len(chunks))}\n    actual={p.as_posix() for p in pathlib.Path(CONTROL).iterdir()}\n    if actual!=expected:raise\
        \ ValueError('Unexpected transfer files')\n    for i,c in enumerate(chunks):\n        if set(c)!={'path','sha256','bytes'}\
        \ or c['path']!=CONTROL+f'payload-{i:04d}.b64':raise ValueError('Chunk schema')\n        b=pathlib.Path(c['path']).read_bytes()\n\
        \        if len(b)!=c['bytes'] or sha(b)!=c['sha256']:raise ValueError('Chunk digest')\n        parts.append(b)\n\
        \    data=validate_archive(m,base64.b64decode(b''.join(parts),validate=True))\n    base=m['public_base_sha']\n   \
        \ git('cat-file','-e',base+'^{commit}')\n    subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)\n\
        \    changed=git('diff','--name-only',base,'HEAD').decode().splitlines()\n    if any(p!=WORKFLOW and not p.startswith(CONTROL)\
        \ for p in changed):raise ValueError('Public baseline advanced; regenerate')\n    for row in m['files']:\n       \
        \ if read_blob('HEAD',row['path'])!=row['before_blob'] or read_blob(base,row['path'])!=row['before_blob']:raise ValueError('Stale\
        \ output: '+row['path'])\n    verify_public_quotations(m,data,lambda *args:git(*args))\n    verify_root_payloads(m,data,lambda\
        \ *args:git(*args))\n    # All destination validation precedes filesystem writes.\n    for p in data:\n        dst=root/p\n\
        \        if not dst.resolve().is_relative_to(root) or any(q.is_symlink() for q in [dst,*dst.parents] if q!=root.parent):raise\
        \ ValueError('Symlink destination')\n    for p,raw in data.items():\n        dst=root/p;dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(raw);dst.chmod(0o644)\n\
        \    for p in pathlib.Path(CONTROL).iterdir():\n        if not p.is_file() or p.is_symlink():raise ValueError('Unexpected\
        \ transfer entry')\n        p.unlink()\n    paths=list(data)+git('ls-files',CONTROL).decode().splitlines()\n    git('add','--',*paths)\n\
        \    staged=set(git('diff','--cached','--name-only').decode().splitlines())\n    if staged!=set(paths):raise ValueError('Unexpected\
        \ staged files or no-op payload')\n    pathlib.Path(os.environ['RUNNER_TEMP'],'runtime-receipt.json').write_text(json.dumps({'public_base_sha':base,'files':len(data),'archive_sha256':m['archive_sha256']}))\n\
        \    print('Validated and staged public runtime:',len(data),'files')\nif __name__=='__main__':main()\nPYRECEIVER\n\
        python3 \"$RUNNER_TEMP/receive-runtime.py\"\n"
    - name: Install Explorer DOM test dependencies
      working-directory: tests/explorer-dom
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Check Explorer columns, memo interactions and sense identity
      run: 'node --check app/shared/explorer-difficulty-v2.js

        node --check app/shared/explorer-inflections.js

        node --check app/shared/lexical-identity.js

        node --test --test-timeout=30000 tests/explorer-dom/overlay.test.cjs tests/explorer-dom/startup.test.cjs tests/explorer-family-tags.test.cjs
        app/shared/explorer-language-tags.test.cjs app/shared/lexical-identity.test.cjs tests/explicit-inflection-eligibility.test.cjs
        app/shared/multilingual-answers.test.cjs

        '
    - name: Check Pages startup and asset routes
      run: 'python3 tools/test_pages_build.py

        node --test --test-timeout=30000 tools/test_pages_assets.cjs

        '
    - name: Commit verified runtime output
      id: commit
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PYTIME''

        import datetime

        assert datetime.datetime.now(datetime.timezone.utc)<datetime.datetime.fromisoformat(''2026-10-31T13:20:00+00:00''),
        ''Authorization window expired''

        PYTIME

        test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"

        git config user.name github-actions[bot]

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git commit -m ''Publish verified dictionary runtime''

        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

        '
    - name: Stage runtime without duplicated media
      run: 'python3 tools/build_dictionary_basics.py --root .

        python3 tools/build_pages.py --repository "$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)" --out _site

        '
    - name: Check generated JavaScript
      run: 'node --check _site/pages-assets.js

        node --check _site/app/eigo-no-e/app.js

        node --check _site/app/eigo-no-e/lexical-utils.js

        node --check _site/app/support/picture-words/reviewed-scenes.js

        node --check _site/app/shared/explorer-difficulty-v2.js

        '
    - name: Publish exact fast-forward commit
      shell: bash
      run: 'set -euo pipefail

        python3 - <<''PYTIME''

        import datetime

        assert datetime.datetime.now(datetime.timezone.utc)<datetime.datetime.fromisoformat(''2026-10-31T13:20:00+00:00''),
        ''Authorization window expired''

        PYTIME

        test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"

        git push origin HEAD:refs/heads/main

        test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"

        '
    - uses: actions/upload-pages-artifact@v3
      with:
        path: _site
    - uses: actions/upload-artifact@v4
      with:
        name: runtime-receipt-${{ github.run_id }}
        path: ${{ runner.temp }}/runtime-receipt.json
        retention-days: 1
  deploy:
    needs: apply
    concurrency:
      group: pages-runtime-push-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Verify current main under shared Pages concurrency
      id: window
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_SHA: ${{ needs.apply.outputs.published_sha }}
      run: "python3 - <<'PYWAIT'\nimport datetime,json,os,time,urllib.request\nendpoint='https://api.github.com/repos/haibaratou/etymolingo/'\n\
        def get(path):\n    q=urllib.request.Request(endpoint+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})\n\
        \    with urllib.request.urlopen(q,timeout=30) as r:return json.load(r)\nassert datetime.datetime.now(datetime.timezone.utc)<datetime.datetime.fromisoformat('2026-10-31T13:20:00+00:00'),\
        \ 'Authorization window expired'\nassert get('git/ref/heads/main')['object']['sha']==os.environ['EXPECTED_SHA'], 'Main\
        \ advanced; do not deploy stale runtime'\nremaining=int((datetime.datetime.fromisoformat('2026-10-31T13:20:00+00:00')-datetime.datetime.now(datetime.timezone.utc)).total_seconds())-15\n\
        assert remaining>=60, 'Too little time remains to deploy'\nwith open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('timeout_ms='+str(min(1200000,remaining*1000))+'\\\
        n')\nPYWAIT\n"
    - name: Deploy verified runtime
      id: deployment
      uses: actions/deploy-pages@v4
      with:
        timeout: ${{ steps.window.outputs.timeout_ms }}
