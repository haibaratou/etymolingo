name: Publish runtime site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-runtime-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 15
        with:
          # Keep the full Git index for media routing; fetch only selected blobs.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !*.[pP][nN][gG]
            !*.[wW][eE][bB][pP]
            !*.[jJ][pP][gG]
            !*.[jJ][pP][eE][gG]
            !*.[gG][iI][fF]
            !*.[aA][vV][iI][fF]
            !*.[mM][pP]4
            !*.[wW][eE][bB][mM]
            !*.[mM][pP]3
            !*.[wW][aA][vV]
            !*.[oO][gG][gG]
            !/app/support/picture-words/scene-assets/
            !/work/etymopedia/.workflow/
            !/work/etymopedia/old/
            !/work/etymopedia/ui-update-20261030/
            !/work/etymopedia/tmp/
            /assets/ui/**
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/explorer-dom/package-lock.json
      - name: Install Explorer DOM test dependencies
        working-directory: tests/explorer-dom
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Explorer columns, memo interactions and sense identity
        run: |
          node --check app/shared/explorer-difficulty-v2.js
          node --check app/shared/explorer-inflections.js
          node --check app/shared/lexical-identity.js
          node --test --test-timeout=30000 tests/explorer-dom/overlay.test.cjs tests/explorer-dom/startup.test.cjs tests/explorer-family-tags.test.cjs tests/etymological-reader-prose.test.cjs app/shared/explorer-language-tags.test.cjs app/shared/lexical-identity.test.cjs tests/explicit-inflection-eligibility.test.cjs app/shared/multilingual-answers.test.cjs
      - name: Check Pages startup and asset routes
        run: |
          python3 tools/test_pages_build.py
          node --test --test-timeout=30000 tools/test_pages_assets.cjs
      - name: Stage runtime without duplicated media
        run: |
          python3 tools/build_dictionary_basics.py --root .
          python3 tools/build_pages.py --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --out _site
      - name: Check generated JavaScript
        run: |
          node --check _site/pages-assets.js
          node --check _site/app/eigo-no-e/app.js
          node --check _site/app/eigo-no-e/lexical-utils.js
          node --check _site/app/support/picture-words/reviewed-scenes.js
          node --check _site/app/shared/explorer-difficulty-v2.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy runtime
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000


