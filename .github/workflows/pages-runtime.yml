name: Publish runtime site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-runtime
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage runtime without duplicated media
        run: |
          python3 tools/build_dictionary_basics.py --root .
          python3 tools/build_pages.py --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --out _site
      - name: Check generated JavaScript
        run: |
          node --check _site/pages-assets.js
          node --check _site/app/eigo-no-e/app.js
          node --check _site/app/eigo-no-e/lexical-utils.js
          node --check _site/app/games/picture-words/reviewed-scenes.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy runtime
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000

