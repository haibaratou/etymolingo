<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="file:///tmp/claude-0/fonts.css">
<style>
:root{--ink:#3a2618;--blue:#2eaaf7;--red:#fd7155;--yellow:#fec514;--green:#5cc45a;--teal:#2cbfba;--bg:#fffaf0;
  --jp:"M PLUS Rounded 1c",sans-serif;--en:"Fredoka",sans-serif;--pop:cubic-bezier(.3,1.6,.5,1)}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:var(--jp);color:var(--ink)}
.stage{position:absolute;inset:0;overflow:hidden;
  background:radial-gradient(circle at 10% 20%,rgba(46,170,247,.13) 0 260px,transparent 261px),
  radial-gradient(circle at 90% 12%,rgba(254,197,20,.2) 0 300px,transparent 301px),
  radial-gradient(circle at 85% 88%,rgba(44,191,186,.13) 0 280px,transparent 281px),
  radial-gradient(circle at 8% 92%,rgba(253,113,85,.12) 0 240px,transparent 241px),var(--bg)}
.dots{position:absolute;inset:-40px;background:radial-gradient(rgba(58,38,24,.07) 2px,transparent 2.5px) 0 0/36px 36px;animation:drift 24s linear both}
@keyframes drift{to{transform:translate(36px,36px)}}
.scene{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
/* 汎用の動き */
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes out{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.96)}}
@keyframes pop{0%{opacity:0;transform:translate(var(--tx,0),var(--ty,0)) scale(.3) rotate(var(--r0,-8deg))}65%{opacity:1;transform:translate(var(--tx,0),var(--ty,0)) scale(1.08) rotate(0)}100%{opacity:1;transform:translate(var(--tx,0),var(--ty,0)) scale(1) rotate(var(--r1,0deg))}}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes fromL{from{opacity:0;transform:translateX(-700px) rotate(-12deg)}70%{opacity:1;transform:translateX(30px) rotate(3deg)}to{opacity:1;transform:none}}
@keyframes fromR{from{opacity:0;transform:translateX(700px) rotate(12deg)}70%{opacity:1;transform:translateX(-30px) rotate(-3deg)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-14px)}}
@keyframes sway{50%{transform:rotate(3deg)}}
@keyframes twinkle{0%,100%{transform:scale(.7) rotate(0);opacity:.5}50%{transform:scale(1.15) rotate(20deg);opacity:1}}
.chr{display:block;height:100%;width:auto}
.bob{animation:bob 1.6s ease-in-out infinite}
.star{position:absolute;font-size:56px;color:var(--yellow);text-shadow:0 3px 0 rgba(58,38,24,.15);animation:twinkle 1.8s ease-in-out infinite}
.head{position:absolute;left:0;right:0;top:70px;text-align:center;font:900 76px/1.2 var(--jp);letter-spacing:.02em}
.head em{font-style:normal;color:var(--red)}
.head .b{color:var(--blue)}
.card{position:absolute;background:#fff;border:5px solid var(--ink);border-radius:40px;box-shadow:0 12px 0 var(--ink)}

/* S1 */
#s1{animation:in .01s both 0s,out .45s forwards 3.0s}
#logo{left:50%;top:220px;width:1180px;margin-left:-590px;animation:pop .9s var(--pop) both .15s}
#tag1{left:0;right:0;top:640px;text-align:center;font:900 64px var(--jp);animation:up .6s var(--pop) both 1.1s}
#tag1 span{display:inline-block;background:var(--ink);color:#fff;padding:10px 40px 14px;border-radius:999px}
#b1{left:110px;top:520px;height:460px;animation:fromL .9s var(--pop) both .5s}
#g1{right:110px;top:520px;height:460px;animation:fromR .9s var(--pop) both .7s}

/* S2 */
#s2{animation:in .3s both 3.25s,out .45s forwards 7.7s}
#s2 .head{animation:up .6s var(--pop) both 3.35s}
#bar{left:410px;top:250px;width:1100px;height:130px;border-radius:999px;display:flex;align-items:center;gap:26px;padding:0 40px;animation:up .6s var(--pop) both 3.6s}
#bar svg{width:56px;height:56px;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
#typed{font:600 76px var(--en);letter-spacing:.02em}
#caret{width:6px;height:74px;background:var(--blue);border-radius:3px;margin-left:-18px}
#btn{margin-left:auto;background:var(--yellow);border-radius:999px;padding:14px 44px;font:900 42px var(--jp)}
#res{left:660px;top:440px;width:600px;height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:pop .8s var(--pop) both 5.0s}
#res img{height:380px}
#res b{font:600 96px/1 var(--en)}
#res span{font:800 40px var(--jp);color:#8a6f5c;margin-top:4px}
#bp{left:150px;top:500px;height:500px;animation:fromL .8s var(--pop) both 5.35s}
#gj{right:170px;top:500px;height:480px;animation:pop .8s var(--pop) both 5.6s}

/* S3 */
#s3{animation:in .3s both 7.95s,out .45s forwards 13.45s}
#s3 .head{animation:up .6s var(--pop) both 8.05s}
#grid{position:absolute;left:110px;top:225px;width:1700px;display:grid;grid-template-columns:repeat(6,1fr);gap:28px 30px;animation:zoom 2.5s ease-in-out both 11.2s}
@keyframes zoom{to{transform:scale(1.04)}}
.act{position:relative;height:370px;border:4px solid var(--ink);border-radius:32px;box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:16px;opacity:0;animation:pop .7s var(--pop) both}
.act:nth-child(5n+1){background:#e3f3fe}.act:nth-child(5n+2){background:#ffe8e2}.act:nth-child(5n+3){background:#fff3c8}.act:nth-child(5n+4){background:#e4f6e3}.act:nth-child(5n){background:#dcf5f4}
.act img{height:232px;margin-bottom:auto;margin-top:16px}
.act b{font:600 50px/1 var(--en)}
.act span{font:800 24px var(--jp);color:#7a6150;margin-top:6px}

/* S4 */
#s4{animation:in .3s both 13.75s,out .45s forwards 18.25s}
#s4 .head{animation:up .6s var(--pop) both 13.85s}
#chips{position:absolute;left:0;right:0;top:220px;display:flex;justify-content:center;gap:22px}
.chip{font:900 40px var(--jp);color:#fff;padding:12px 38px 16px;border-radius:999px;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);opacity:0;animation:pop .6s var(--pop) both}
.row{position:absolute;left:0;display:flex;gap:34px;width:max-content}
#row1{top:360px;animation:slideL 5s linear both 13.9s}
#row2{top:620px;animation:slideR 5s linear both 13.9s}
@keyframes slideL{from{transform:translateX(0)}to{transform:translateX(-900px)}}
@keyframes slideR{from{transform:translateX(-1300px)}to{transform:translateX(-400px)}}
.circ{width:230px;height:230px;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink);display:grid;place-items:center}
.circ img{width:78%;height:78%;object-fit:contain}
#runner{top:845px;height:230px;display:flex;gap:10px;animation:run 4.4s linear both 14.0s}
@keyframes run{from{transform:translateX(-500px)}to{transform:translateX(2100px)}}
#runner img{height:230px;animation:bob .35s ease-in-out infinite}
#runner img+img{animation-delay:.17s}


/* S4.5 パズル(Pictlingo) */
#sP{animation:in .3s both 18.6s,out .45s forwards 29.0s}
#sP .head{animation:up .6s var(--pop) both 18.7s}
#wcard{left:110px;top:250px;width:640px;padding:30px 34px 34px;animation:pop .7s var(--pop) both 18.9s}
#wcard .wimg{display:flex;align-items:center;gap:26px}
#wcard .wimg img{width:230px;height:230px;object-fit:contain;background:#fff8e6;border-radius:28px;border:3px solid #f1e4cf}
#wcard h3{margin:0;font:600 104px/1 var(--en)}
#wcard h3+span{display:block;font:900 40px var(--jp);color:#7a6150;margin-top:6px}
#wcard .pz{display:flex;gap:18px;margin-top:30px}
#wcard .pz span{flex:1;text-align:center;font:900 32px var(--jp);padding:18px 0 20px;border:4px solid var(--ink);border-radius:999px;box-shadow:0 6px 0 var(--ink);background:#fff}
#wcard .pz span.on{background:var(--blue);color:#fff}
#wcard .pz span.on2{background:var(--red);color:#fff}
#wlabel{display:block;margin-top:22px;font:800 26px var(--jp);color:#7a6150;text-align:center}
#phone{left:1000px;top:205px;width:450px;height:860px;border-radius:64px;background:var(--ink);padding:16px;box-shadow:0 18px 0 rgba(58,38,24,.25);animation:pop .8s var(--pop) both 19.75s}
#phone img{display:block;width:418px;height:815px;object-fit:cover;object-position:top;border-radius:50px;background:#fff}
#cursor{position:absolute;left:0;top:0;width:70px;height:70px;z-index:9;opacity:0;filter:drop-shadow(0 4px 0 rgba(58,38,24,.3))}
#feat{left:1510px;top:270px;width:380px;display:flex;flex-direction:column;gap:22px}
#feat div{font:900 29px/1.35 var(--jp);background:#fff;border:4px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);padding:18px 22px;opacity:0;animation:pop .6s var(--pop) both}
#feat div i{font-style:normal;display:block;font:600 26px var(--en);color:var(--blue)}
#pzGirl{left:1560px;top:760px;height:300px;animation:pop .7s var(--pop) both 24.6s}
#pzBoy{left:770px;top:770px;height:290px;animation:fromL .7s var(--pop) both 26.4s}
#pname{left:1000px;top:150px;width:450px;text-align:center;font:600 46px var(--en);animation:up .5s var(--pop) both 19.9s}
#pname small{font:800 24px var(--jp);color:#7a6150;margin-left:8px}

/* S5 */
#s5{animation:in .5s both 29.35s}
#heroWrap{position:absolute;inset:0;animation:shrink .9s var(--pop) both 31.3s}
@keyframes shrink{from{transform:none}to{transform:translate(-335px,-10px) scale(.6)}}
#hero{position:absolute;inset:0;background:url(hero-carnival.png) center 78%/cover;animation:kb 2s ease-out both 29.35s,frame .9s both 31.3s}
@keyframes kb{from{transform:scale(1.16)}to{transform:scale(1)}}
@keyframes frame{to{border-radius:56px;box-shadow:0 0 0 8px var(--ink),0 20px 0 8px var(--ink)}}
#endtxt{position:absolute;left:1270px;top:170px;width:600px;animation:up .7s var(--pop) both 31.8s}
#endtxt p{margin:0;font:900 62px/1.2 var(--jp)}
#endtxt p b{display:block;font:600 120px/1 var(--en);color:var(--blue)}
#endtxt small{display:block;font:800 30px/1.5 var(--jp);color:#7a6150;margin-top:14px}
#cele{left:1330px;top:560px;height:440px;animation:pop .8s var(--pop) both 32.2s}
#fade{position:absolute;inset:0;background:#fff;opacity:0}
</style></head><body>
<div class="stage">
  <div class="dots"></div>

  <section class="scene" id="s1">
    <span class="star" style="left:300px;top:150px;animation-delay:-.3s">★</span>
    <span class="star" style="left:1560px;top:190px;animation-delay:-1s">★</span>
    <span class="star" style="left:860px;top:110px;font-size:40px;animation-delay:-.6s">✦</span>
    <span class="star" style="left:1280px;top:600px;font-size:44px;color:var(--teal);animation-delay:-1.3s">✦</span>
    <img id="logo" class="abs" src="pictpedia-logo.png" alt="">
    <div id="tag1" class="abs"><span>英単語の イラスト辞典</span></div>
    <div id="b1" class="abs"><img class="chr bob" src="c/boy-welcome.png" alt=""></div>
    <div id="g1" class="abs"><img class="chr bob" style="animation-delay:-.8s" src="c/girl-welcome.png" alt=""></div>
  </section>

  <section class="scene" id="s2">
    <div class="head">さがしたい<em>単語</em>を、入れるだけ。</div>
    <div id="bar" class="card"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span id="typed"></span><span id="caret"></span><span id="btn">さがす</span></div>
    <div id="res" class="card"><img src="w/cat.png" alt=""><b>cat</b><span>ねこ</span></div>
    <div id="bp" class="abs"><img class="chr" src="c/boy-pointing.png" alt=""></div>
    <div id="gj" class="abs"><img class="chr bob" src="c/girl-joy.png" alt=""></div>
  </section>

  <section class="scene" id="s3">
    <div class="head"><span class="b">ふたり</span>が、どんな<em>単語</em>も演じます。</div>
    <div id="grid"></div>
  </section>

  <section class="scene" id="s4">
    <div class="head">カテゴリーから、<em>さがせる</em>。</div>
    <div id="chips"></div>
    <div class="row" id="row1"></div>
    <div class="row" id="row2"></div>
    <div id="runner" class="abs"><img src="c/boy-running.png" alt=""><img src="c/girl-running.png" alt=""></div>
  </section>

  
  <section class="scene" id="sP">
    <div class="head">見つけた絵で、そのまま<em>パズル</em>。</div>
    <div id="wcard" class="card">
      <div class="wimg"><img src="w/cat.png" alt=""><div><h3>cat</h3><span>ねこ</span></div></div>
      <div class="pz"><span id="pzEn">英語パズル ↗</span><span id="pzJa">日本語パズル ↗</span></div>
      <span id="wlabel">Pictpedia の単語ページから</span>
    </div>
    <div id="pname" class="abs">Pictlingo<small>ことばパズル</small></div>
    <div id="phone" class="abs"><img id="screen" src="clip/en_0140.jpg" alt=""></div>
    <div id="feat" class="abs">
      <div style="animation-delay:20.6s"><i>Trace!</i>絵を見て、文字をなぞる</div>
      <div style="animation-delay:21.4s"><i>EN / JA</i>英語でも日本語でも</div>
      <div style="animation-delay:22.2s"><i>Collect!</i>見つけた単語は辞書にたまる</div>
    </div>
    <img id="pzGirl" class="abs" src="c/girl-joy.png" alt="">
    <img id="pzBoy" class="abs" src="c/boy-surprised.png" alt="">
    <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 9-6.5 1.6L16 20l-3 1.4-3.6-7.4L4 18z" fill="#fff" stroke="#3a2618" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </section>

  <section class="scene" id="s5">
    <div id="heroWrap"><div id="hero"></div></div>
    <div id="endtxt"><p><b>12,344</b>枚の英単語イラスト</p><small>英語でも日本語でも<br>さがせるイラスト辞典</small></div>
    <img id="cele" class="abs" src="celebrate.png" alt="">
  </section>
  <div id="fade"></div>
</div>
<script>
const ACTS=[['help','助ける'],['run','走る'],['hug','抱きしめる'],['sing','歌う'],['sleep','眠る'],['swim','泳ぐ'],['kick','ける'],['dance','踊る'],['cry','泣く'],['draw','描く'],['climb','登る'],['catch','つかまえる']];
document.getElementById('grid').innerHTML=ACTS.map(([w,j],i)=>`<div class="act" style="animation-delay:${(8.45+i*0.17).toFixed(2)}s;--r1:${i%2?1.5:-1.5}deg"><img src="w/${w}.png" alt=""><b>${w}</b><span>${j}</span></div>`).join('');
const CH=[['動物','var(--blue)'],['食べ物','var(--red)'],['乗り物','var(--yellow)'],['自然','var(--green)'],['くらし','var(--teal)']];
document.getElementById('chips').innerHTML=CH.map(([t,c],i)=>`<span class="chip" style="background:${c};animation-delay:${(14.1+i*.12).toFixed(2)}s">${t}</span>`).join('');
const R1='cat dog rabbit elephant bird penguin fish apple banana cake pizza'.split(' ');
const R2='car bus plane bicycle tree sun flower house cat apple pizza bird'.split(' ');
const circ=w=>`<div class="circ"><img src="w/${w}.png" alt=""></div>`;
document.getElementById('row1').innerHTML=R1.map(circ).join('');
document.getElementById('row2').innerHTML=R2.map(circ).join('');
document.getElementById('row1').style.left='60px';
// 時刻 t(秒)の画面にする
window.render=t=>{
  for(const a of document.getAnimations())a.currentTime=t*1000;
  const word='cat',k=Math.max(0,Math.min(word.length,Math.floor((t-4.0)/0.28)+1));
  document.getElementById('typed').textContent=t<4.0?'':word.slice(0,k);
  document.getElementById('caret').style.opacity=(Math.floor(t*2.2)%2===0||t<5)?1:0;
  document.getElementById('btn').style.transform=(t>4.8&&t<5.05)?'scale(.92)':'none';

  const lerp=(a,b,k)=>a+(b-a)*Math.max(0,Math.min(1,k)), ease=k=>k<0?0:k>1?1:k*k*(3-2*k);
  const cur=document.getElementById('cursor');
  const pts=[[18.9,900,1000],[19.4,282,572],[19.6,282,572],[25.9,282,572],[26.3,574,572],[26.6,574,572],[28.9,574,572]];
  let cx=pts[0][1],cy=pts[0][2];
  for(let i=0;i<pts.length-1;i++){const [t0,x0,y0]=pts[i],[t1,x1,y1]=pts[i+1];if(t>=t0&&t<=t1){const k=ease((t-t0)/(t1-t0));cx=lerp(x0,x1,k);cy=lerp(y0,y1,k);}}
  if(t>28.9){cx=574;cy=572;}
  const down=(t>19.45&&t<19.65)||(t>26.35&&t<26.55);
  cur.style.opacity=(t>19.0&&t<29.0)?1:0;
  cur.style.transform=`translate(${cx}px,${cy}px) scale(${down?.85:1})`;
  document.getElementById('pzEn').className=(t>19.45&&t<26.35)?'on':'';
  document.getElementById('pzJa').className=t>26.35?'on2':'';
  let src;
  if(t<26.5){const f=Math.round(140+Math.max(0,t-19.9)*30);src='clip/en_'+String(Math.min(330,f)).padStart(4,'0')+'.jpg';}
  else{const f=Math.round(150+(t-26.5)*30*1.45);src='clip/ja_'+String(Math.min(300,f)).padStart(4,'0')+'.jpg';}
  const scr=document.getElementById('screen'); if(!scr.src.endsWith(src))scr.src=src;
  document.getElementById('fade').style.opacity=t>34.2?Math.min(1,(t-34.2)/0.6):0;
};
document.getAnimations().forEach(a=>a.pause());
window.ready=true;
window.screenReady=()=>document.getElementById('screen').decode().catch(()=>0);
</script>
</body></html>
