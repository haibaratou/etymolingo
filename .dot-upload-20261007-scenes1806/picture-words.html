<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ec" id="themeColor">
  <meta name="description" content="一枚の絵から、ことばが咲く。日本語と英語で遊べる、なぞってつなぐイラストパズル。">
  <title>Pictlingo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%232c5146'/%3E%3Cg fill='%23f4bf9f'%3E%3Cellipse cx='32' cy='22' rx='8' ry='13'/%3E%3Cellipse cx='32' cy='42' rx='8' ry='13'/%3E%3Cellipse cx='22' cy='32' rx='13' ry='8'/%3E%3Cellipse cx='42' cy='32' rx='13' ry='8'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='6' fill='%23f8edbc'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
  <link rel="manifest" href="picture-words/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="picture-words/style.css?v=55856cd9ea8d">
  <script src="picture-words/desktop.js?v=pictlingo8" defer></script>
  <script src="picture-words/catalog.js?v=dde3b01184e9" defer></script>
  <script src="picture-words/difficulty.js?v=608642e9ac23" defer></script>
  <script src="picture-words/gesture.js?v=2a4781a2dbdc" defer></script>
  <script src="picture-words/pronunciation.js?v=dcb3952cb4a4" defer></script>
  <script src="picture-words/progression.js?v=new-card1" defer></script>
  <script src="picture-words/reviewed-scenes.js?v=861f9beb3a65" defer></script>
  <script src="picture-words/offline.js?v=32f21e1f97a9" defer></script>
  <link rel="stylesheet" href="../shared/illustration-scenes.css?v=footer2">
  <script src="../shared/illustration-scenes.js?v=labels2" defer></script>
  <script src="picture-words/game.js?v=59a49dbe4070" defer></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-flower" viewBox="0 0 32 32"><path d="M16 12C5-3 0 14 11 16-3 24 14 33 16 21c8 14 17-3 5-5C35 8 18-1 16 12Z" fill="currentColor"/><circle cx="16" cy="16" r="3.5" fill="#f9edc8"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5V4Zm4 4c2 2 2 6 0 8m3-11c4 4 4 10 0 14"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5V4Zm5 5 6 6m0-6-6 6"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 8.8a2.6 2.6 0 0 1 5 .8c0 2-2.5 2.1-2.5 4M12 17h.01"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 15.2A8.7 8.7 0 0 1 8.8 3.5 8.8 8.8 0 1 0 20.5 15.2Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.3-1.4 1.4M6.3 17.7l-1.4 1.4"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M10 5h4m-2 13h.01"/></symbol>
    <symbol id="i-desktop" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 21h6m-3-5v5"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 6h3c5 0 7 12 12 12h3m-4-4 4 4-4 4M3 18h3c1.6 0 3-1.3 4.3-3.2M14 8.9C15.3 7.1 16.5 6 18 6h3m-4-4 4 4-4 4"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M8 17c0-4-3-3.8-3-8a7 7 0 0 1 14 0c0 4.2-3 4-3 8H8Zm1 4h6m-3-7V9m-2 0 2 2 2-2"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5C9 3 5 3 2 4v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-3-1-7-1-10 1v15"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="m8 4-5 5 5 5M3 9h10a6 6 0 0 1 0 12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19C0 5 11 2 21 3c1 12-7 19-16 16Zm0 0L16 8M3 22l2-3"/></symbol>
  </svg>
  <div class="ambient ambient-one" aria-hidden="true"></div><div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="picture-words.html" aria-label="Pictlingo ホーム">
        <span class="brand-mark"><svg><use href="#i-flower"/></svg></span>
        <span><b>Pictlingo</b><small>ことばの庭</small></span>
      </a>
      <nav class="header-actions" aria-label="ゲーム設定">
        <button class="icon-button" id="reloadGame" type="button" aria-label="最新版にリロード" title="最新版にリロード"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2 5M20 12l-4-5"/></svg></button>
        <button class="icon-button" id="closeGame" type="button" aria-label="ゲームを閉じる"><svg><use href="#i-close"/></svg></button>
        <button class="icon-button" id="theme" type="button" aria-label="ダークモードにする" aria-pressed="false"><svg><use href="#i-moon"/></svg></button>
        <button class="icon-button sound-button" id="sound" type="button" aria-label="音声と効果音をオフ" aria-pressed="true"><svg><use href="#i-sound"/></svg></button>
        <button class="icon-button" id="help" type="button" aria-label="遊び方"><svg><use href="#i-help"/></svg></button>
      </nav>
    </header>

    <main id="game" class="game-shell" data-state="loading">
      <button id="dailyCollection" class="daily-collection" type="button" aria-label="今日の収集ページを開く">
        <span class="daily-heading"><span id="dailyTitle">きょうの1ページ</span><span id="dailyStreak"></span></span>
        <span class="daily-main"><strong id="dailyCount">0 <small>/ 10</small></strong><span id="dailyMessage">絵を集めて、辞書を育てよう</span><svg aria-hidden="true"><use href="#i-book"/></svg></span>
        <span id="dailySlots" class="daily-slots"></span>
      </button>
      <section class="chapter-bar" aria-label="進行状況">
        <div class="chapter-heading"><span class="eyebrow" id="chapterNumber">GARDEN 01</span><h1 id="chapterName">はじまりの庭</h1></div>
        <button id="difficulty" class="level-pill difficulty-pill" type="button" aria-label="難易度を選ぶ"><span class="level-dot"></span><small class="pill-label" id="difficultyLabel">出題</small><span id="difficultyText">RANK 7</span><span class="chevron">⌄</span></button>
        <button id="levels" class="level-pill stage-select-button" type="button" aria-label="ステージを選ぶ"><span class="level-dot"></span><span id="stageSelectLabel">ステージ選択</span><span id="levelText">01 / 80</span><span class="chevron">⌄</span></button>
        <div class="chapter-progress" id="progress" aria-label="庭の進み具合"></div>
        <div class="discovery-count"><svg><use href="#i-flower"/></svg><b id="foundCount">0</b><span id="foundLabel">ことば発見</span></div>
      </section>

      <div class="play-layout">
        <section class="clue-section" aria-labelledby="clueHeading">
          <h2 id="clueHeading" hidden>この絵、なんのことば？</h2>
          <div class="picture-card" id="pictureCard">
            <span id="newCardBadge" class="new-card-badge" hidden>NEW</span>
            <span class="paper-tape" aria-hidden="true"></span>
            <div class="picture-meta"><span id="pictureNumber">NO. 001</span></div>
            <div class="picture-stage">
              <div class="picture-halo" aria-hidden="true"></div>
              <span class="picture-spark spark-one" aria-hidden="true">✧</span><span class="picture-spark spark-two" aria-hidden="true">✦</span>
              <img id="clueImage" alt="答えを考えるためのイラスト" draggable="false" width="512" height="512">
              <div class="image-error" id="imageError" hidden><p id="imageErrorText">イラストを読み込めませんでした</p><button id="retryImage" type="button">もう一度読み込む</button><button id="skipImage" type="button">次の絵へ</button></div>
            </div>
            <span id="rarityBadge" class="rarity-badge"></span>
            <span class="picture-stamp" id="pictureStamp" aria-hidden="true">WORD GET!</span>
            <div id="rankUp" class="rank-up" role="status" hidden><strong id="rankUpName"></strong><span id="rankUpDetail"></span><span id="rankUpDiamonds" aria-hidden="true"></span></div>

          </div>
          <div class="answer-wrap">
            <div class="answer" id="answer" aria-label="答えのマス"></div>
            <div class="answer-info" hidden><span id="answerInfo"></span></div>
          </div>
        </section>

        <section class="interaction-section" aria-label="文字をつなぐ">
          <div class="wheel-intro" hidden><span class="eyebrow" id="connectLabel"></span><p id="instruction"></p></div>
          <div class="wheel" id="wheel" role="group" aria-label="なぞって答える文字盤">
            <div class="constellation-sky" aria-hidden="true"></div>
            <div class="combo-meter" id="combo" data-level="0" aria-live="polite"><span class="combo-count" id="comboCount">0</span><span class="combo-word">COMBO</span><span class="combo-pips" id="comboPips" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><small id="comboBest">BEST 0</small></div>
            <div id="ringGuide" class="ring-guide" aria-live="polite" hidden></div>
            <div class="wheel-orbit orbit-one" aria-hidden="true"></div><div class="wheel-orbit orbit-two" aria-hidden="true"></div>
            <span class="orbit-spark" aria-hidden="true">✦</span>
            <svg class="trail" id="trail" viewBox="0 0 360 360" aria-hidden="true"><defs><filter id="trail-glow"><feGaussianBlur stdDeviation="4"/></filter></defs><polyline id="trailGlow" class="trail-glow"/><polyline id="trailLine"/><circle id="trailTip" r="6" cx="180" cy="180"/></svg>
            <div class="letters" id="letters"></div>
            <div class="praise" id="praise" aria-hidden="true"></div>
            <button id="undo" type="button" hidden aria-label="一文字もどす"></button>
          </div>
          <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
          <p class="gesture-note" id="gestureNote" hidden></p>
        </section>
        <div class="play-toolbar" id="gameActions" role="group" aria-label="ゲーム操作">
          <button id="modeToggle" type="button" data-mode="en" aria-label="英語に切り替える"><span id="modeLabel"><span class="mode-ja">日本語</span><span aria-hidden="true">⇄</span><span class="mode-en">英語</span></span></button>
          <button id="listenClue" class="action-button" type="button" aria-label="単語の発音を聞く"><svg><use href="#i-sound"/></svg><span id="listenClueLabel" aria-live="polite">聞く</span></button>
          <button id="shuffle" class="action-button shuffle-button" type="button" aria-label="まぜる"><svg><use href="#i-shuffle"/></svg><span id="shuffleLabel">まぜる</span><span id="centerLabel" hidden></span></button>
          <button id="collection" class="action-button collection-button" type="button"><svg><use href="#i-book"/></svg><span id="collectionLabel">辞書</span><span id="collectionCount">0</span></button>
          <button id="hint" class="action-button hint-button" type="button"><svg><use href="#i-bulb"/></svg><span id="hintLabel">答え</span><span class="free-tag" id="freeTag">FREE</span></button>
        </div>
      </div>

      <footer class="garden-footer"><div><svg><use href="#i-leaf"/></svg><span id="footerNote">正解するたび、辞書が育つ。</span></div></footer>
    </main>
    <div class="page-footnote"><span>PICTURE × LETTERS × A LITTLE JOY</span><span>made for curious minds</span></div>
  </div>
  <div id="rewardBackdrop" class="reward-backdrop" hidden aria-hidden="true"></div>
  <div class="reward-scene" id="rewardScene" popover="manual" hidden>
    <div class="reward-scroll" id="rewardScroll" tabindex="0" role="region" aria-label="獲得したことばの説明">
              <div id="dailyReward" class="daily-reward" role="status"></div>
              <span id="rewardCombo" class="reward-combo" hidden><b id="rewardComboCount">2</b><span>COMBO!</span><small id="rewardComboNote"></small></span>
              <button class="word-reward" id="wordReward" type="button" hidden>
                <span class="book-left"><span id="rewardBookName" class="book-name"></span><span id="rewardShelf" class="book-shelf"></span><span class="book-count"><small id="rewardBefore"></small><strong id="rewardAfter"></strong><small id="rewardTotal"> / 80</small></span><span id="rewardProgress" class="book-progress"></span></span>
                <span class="book-right"><span class="book-page-number" id="rewardPageNumber"></span><span class="book-placeholder" aria-hidden="true">?</span><span class="reward-art-wrap"><img id="rewardArt" class="book-word-art" alt="" width="220" height="220"><span id="rewardSeal" class="result-stamp" role="status"></span></span><strong id="rewardWord" class="book-word"></strong><small id="rewardReading" class="book-reading"></small><span id="rewardStars" class="reward-stars" aria-hidden="true"></span></span>
              </button>
              <div id="rewardExplanation" class="reward-explanation" hidden></div>
              <div id="winPronunciation" class="win-pronunciation" hidden></div>
    </div>
              <button id="advanceLabel" class="advance-label" type="button">次の問題へ <span aria-hidden="true">→</span></button>
            </div>
  <canvas id="particles" aria-hidden="true"></canvas>
  <dialog id="launchScreen" aria-labelledby="launchTitle">
    <h1 id="launchTitle">Pictlingo</h1>
    <p>絵を見て、かなと英語をつなごう。</p>
    <img src="../../assets/word/candy.png" alt="カラフルなキャンディー" width="220" height="220">
    <button id="launchDifficulty" class="modal-primary" type="button">難易度設定</button>
    <button id="startPlay" class="modal-primary" type="button">遊ぶ</button>
    <button id="reloadReviewedData" class="modal-primary" type="button" hidden>データを再読み込み</button>
    <button id="saveOffline" class="modal-primary" type="button">20問を保存（約5MB）</button>
    <p id="offlineStatus" role="status">通信できるときに保存すると、圏外でも遊べます。</p>
    <a href="../index.html">ゲーム一覧へ</a>
  </dialog>
  <dialog id="modal" aria-labelledby="modalTitle">
    <div class="modal-top"><span class="eyebrow" id="modalEyebrow">Pictlingo</span><button id="closeModal" class="icon-button" type="button" aria-label="閉じる"><svg><use href="#i-close"/></svg></button></div>
    <h2 id="modalTitle"></h2><div id="modalBody"></div>
  </dialog>
  <noscript>このパズルで遊ぶには JavaScript を有効にしてください。</noscript>
</body>
</html>
