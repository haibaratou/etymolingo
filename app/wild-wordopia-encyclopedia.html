<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ワイルドワードピア | 英単語の祖先ずかん</title>
<meta name="description" content="6000年前の英単語の祖先が、いきもの「ワイルド」になった。ワイルドから生まれた英単語を絵でたどる図鑑。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Shippori+Mincho:wght@800&display=swap" rel="stylesheet">
<style>
/* ワイルドワードピア — 英単語の祖先ずかん(app/etymopedia.html を元に、投稿・参加・いいねを外した版) */
:root{
  --ink:#241f26; --ink2:#5c5462;
  --paper:#fffdf8; --paper2:#fff6ea;
  --coral:#ff5470; --yellow:#ffd23e; --mint:#3ecfa5; --sky:#4aa8ff;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;color:var(--ink);background:var(--paper);background-image:radial-gradient(#00000009 1.5px, transparent 1.5px);background-size:26px 26px;overflow-x:hidden}
img{-webkit-user-drag:none}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.sticker{display:inline-block;background:var(--ink);color:#fff;font-weight:900;padding:6px 16px;border-radius:999px;font-size:14px;letter-spacing:.06em;transform:rotate(-2deg)}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-weight:900;font-size:17px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:13px 28px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .12s, box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.coral{background:var(--coral);color:#fff}
.btn.yellow{background:var(--yellow)}
.rootChip{display:inline-flex;align-items:center;gap:6px;font-weight:900;color:#fff;border-radius:999px;padding:4px 14px;font-size:15px;cursor:pointer}
.rootChip i{font-style:italic;font-family:"Shippori Mincho",serif}

.morphIcons{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.morphIcon{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:transform .12s}
.morphIcon:hover{transform:translateY(-4px)}
.morphIcon .mi{width:54px;height:54px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:2.5px 2.5px 0 var(--ink)}
.morphIcon .mi img{width:86%;height:86%;object-fit:contain}
.morphIcon small{font-size:10.5px;font-weight:900;color:var(--ink2)}
.morphIcon.sm .mi{width:34px;height:34px;border-width:2.5px;box-shadow:2px 2px 0 var(--ink)}
.morphIcon.sm small{display:none}

header{position:sticky;top:0;z-index:100;background:#fffdf8ee;backdrop-filter:blur(6px);border-bottom:3px solid var(--ink)}
header .bar{display:flex;align-items:center;gap:22px;height:70px}
#logo{display:flex;align-items:baseline;gap:10px;cursor:pointer}
#logo b{font-size:26px;font-weight:900}
#logo b span{color:var(--coral)}
#logo small{font-size:12px;color:var(--ink2);font-weight:700}
nav{display:flex;gap:20px;font-weight:900;font-size:15px;margin-left:auto}
nav a{padding:6px 4px;border-bottom:3px solid transparent}
nav a:hover{border-color:var(--coral)}
#searchBox{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:7px 16px;width:250px}
#searchBox input{border:none;outline:none;font-family:inherit;font-size:15px;font-weight:700;width:100%;background:none}

#hero{position:relative;padding:72px 0 40px;overflow:hidden}
#hero h1{font-size:clamp(44px,6.4vw,84px);font-weight:900;line-height:1.24}
#hero h1 .draw{color:var(--coral);position:relative;white-space:nowrap}
#hero h1 .draw::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:14px;background:var(--yellow);z-index:-1;transform:rotate(-1deg)}
#hero .lead{font-size:19px;font-weight:700;color:var(--ink2);margin-top:22px;line-height:2}
#hero .lead b{color:var(--ink)}
#heroCtas{display:flex;gap:16px;margin-top:30px;flex-wrap:wrap}
#stats{display:flex;gap:34px;margin-top:38px;flex-wrap:wrap}
#stats .st{font-weight:900}
#stats .st .n{font-size:38px}
#stats .st .n em{font-style:normal;color:var(--coral)}
#stats .st .l{font-size:13px;color:var(--ink2)}
#heroArt{position:absolute;right:-10px;top:50px;width:430px;pointer-events:none}
.heroCard{position:absolute;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:12px;box-shadow:6px 6px 0 var(--ink);text-align:center;animation:floaty 5s ease-in-out infinite}
.heroCard img{width:100%;height:auto;display:block}
.heroCard .cap{font-weight:900;font-size:15px;margin-top:6px}
.heroCard .by{font-size:11px;color:var(--ink2);font-weight:700}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--rot,0deg))}50%{transform:translateY(-12px) rotate(var(--rot,0deg))}}
#ticker{border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);background:var(--yellow);overflow:hidden;white-space:nowrap;padding:14px 0}
#ticker .track{display:inline-block;animation:mar 90s linear infinite}
#ticker .track:hover{animation-play-state:paused}
@keyframes mar{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#ticker .rc{display:inline-flex;align-items:center;gap:12px;margin:0 26px;cursor:pointer;vertical-align:middle;transition:transform .12s}
#ticker .rc:hover{transform:translateY(-3px)}
#ticker .rc .ic{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:2.5px 2.5px 0 var(--ink);flex:0 0 auto}
#ticker .rc .ic img{width:88%;height:88%;object-fit:contain}
#ticker .rc .tx b{font-family:"Shippori Mincho",serif;font-style:italic;font-size:20px;font-weight:800;display:block;line-height:1.1}
#ticker .rc .tx span{font-size:15px;font-weight:900}
@media (prefers-reduced-motion:reduce){#ticker .track{animation:none}.heroCard{animation:none}}

section{padding:66px 0}
.secHead{display:flex;align-items:baseline;gap:16px;margin-bottom:30px;flex-wrap:wrap}
.secHead h2{font-size:36px;font-weight:900}
.secHead p{color:var(--ink2);font-weight:700}

#rootStrip{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.rootCard{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:18px 14px 14px;text-align:center;cursor:pointer;box-shadow:5px 5px 0 var(--ink);transition:transform .14s;position:relative;overflow:hidden}
.rootCard:hover{transform:translateY(-6px) rotate(-1deg)}
.rootCard::before{content:"";position:absolute;inset:0 0 auto;height:10px;background:var(--rc)}
.rootCard img{width:110px;height:110px;object-fit:contain}
.rootCard .rr{font-weight:900;font-size:23px;margin-top:6px}
.rootCard .rm{font-weight:900;font-size:16px}
.rootCard .rn{font-size:12px;color:var(--ink2);font-weight:700;margin-top:2px}

/* 単語ずかん(図版ギャラリー統合) */
#wordGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.wcard{background:#fff;border:3px solid var(--ink);border-radius:22px;overflow:hidden;cursor:pointer;box-shadow:5px 5px 0 var(--ink);transition:transform .14s;display:flex;flex-direction:column}
.wcard:hover{transform:translateY(-6px)}
.wcard .thumb{height:150px;display:flex;align-items:center;justify-content:center;background:var(--paper2);border-bottom:3px solid var(--ink);position:relative}
.wcard .thumb img{max-height:88%;max-width:88%;object-fit:contain}
.wcard .thumb .want{font-size:13px;font-weight:900;color:var(--ink2);text-align:center;border:2.5px dashed #c9bfae;border-radius:14px;padding:12px 18px;background:#fff}
.wcard .thumb .cardMorphs{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.wcard .thumb .by{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:900;color:#fff;background:#241f26bb;border-radius:999px;padding:2px 10px}
.wcard .body{padding:12px 14px 14px;flex:1}
.wcard .stars{font-size:12px;letter-spacing:1.5px;color:#f2c14e;margin-bottom:2px}
.wcard .stars .off,.entryStars .off{color:#e5dccb}
.entryStars{font-size:18px;letter-spacing:2px;color:#f2c14e;margin-top:8px}
.wcard .hw{font-size:24px;font-weight:900}
.wcard .jp{font-size:14px;font-weight:700;color:var(--ink2);margin-top:2px}
.wcard .fm{font-size:13px;font-weight:900;margin-top:8px;line-height:1.9}
.wcard .fm .p{border:2px solid var(--ink);border-radius:8px;padding:0 7px;background:#fff;white-space:nowrap}

#view{min-height:400px;padding:44px 0 70px}
.entryTop{display:flex;gap:44px;align-items:flex-start;margin-top:10px;position:relative;isolation:isolate}
.entryBgEtymons{position:absolute;inset:-18px 0 0;z-index:0;display:flex;align-items:center;justify-content:center;gap:34px;pointer-events:none;overflow:hidden;opacity:.72;filter:saturate(1)}
.entryBgEtymons img{width:min(36vw,430px);max-height:92%;object-fit:contain;opacity:.70;transform:rotate(var(--rot,0deg)) translateY(var(--dy,0));filter:drop-shadow(8px 12px 0 rgba(36,31,38,.08))}
.entryBgEtymons.multi img{width:min(24vw,300px);opacity:.70}
.entryBgEtymons img:nth-child(2){--rot:5deg;--dy:22px}
.entryBgEtymons img:nth-child(3){--rot:-4deg;--dy:-18px}
.entryBgEtymons img:nth-child(4){--rot:3deg;--dy:10px}
.entryMain{flex:1;min-width:0;position:relative;z-index:1}
.entryHW{font-size:clamp(56px,8vw,104px);font-weight:900;line-height:1.05}
.entryHW .rootpart{color:var(--rc)}
.entryIPA{font-size:20px;color:var(--ink2);font-weight:700;margin-top:6px}
.posTag{display:inline-block;background:var(--ink);color:#fff;font-size:14px;font-weight:900;border-radius:8px;padding:2px 12px;margin-right:10px;vertical-align:middle}
.entryJP{font-size:26px;font-weight:900;margin-top:14px}
.entryMorphRow{margin-top:22px}
.formula{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:24px;font-weight:900;font-size:21px}
.formula .part{border:3px solid var(--ink);border-radius:14px;padding:6px 16px;background:#fff;box-shadow:3px 3px 0 var(--ink)}
.formula .part small{display:block;font-size:12px;color:var(--ink2);text-align:center}
.formula .part.root{background:var(--rc);color:#fff}
.formula .part.root small{color:#ffffffcc}
.gloss{margin-top:18px;font-size:24px;font-weight:900;color:var(--coral);display:inline-block}
.gloss::before{content:"➡ "}
.exBox{margin-top:26px;border-left:6px solid var(--yellow);padding:6px 0 6px 18px}
.exBox .en{font-size:20px;font-weight:900}
.exBox .en mark{background:none;color:var(--coral)}
.exBox .ja{font-size:15px;color:var(--ink2);font-weight:700;margin-top:4px}
.memo{margin-top:26px;background:var(--paper2);border:3px solid var(--ink);border-radius:18px;padding:16px 20px;font-size:16px;font-weight:700;line-height:2}
.memo .mt{display:inline-block;background:var(--coral);color:#fff;font-size:13px;font-weight:900;border-radius:8px;padding:2px 12px;margin-bottom:6px;transform:rotate(-2deg)}

.plateCol{width:420px;flex:0 0 auto;position:relative;z-index:1}
.plateCard{background:#fff;border:3px solid var(--ink);border-radius:26px;box-shadow:7px 7px 0 var(--ink);overflow:hidden;transform:rotate(1.2deg)}
.plateCard .pimg{height:320px;display:flex;align-items:center;justify-content:center;background:var(--paper2);border-bottom:3px solid var(--ink);padding:14px;position:relative}
.plateCard .pimg img{max-width:100%;max-height:100%;object-fit:contain}
.plateCard .pimg .want{border:3px dashed #c9bfae;border-radius:18px;padding:34px 24px;text-align:center;font-weight:900;color:var(--ink2);line-height:2;background:#fff}
.plateCard .pmeta{display:flex;align-items:center;gap:10px;padding:12px 16px}
.plateCard .pmeta .by{font-weight:900;font-size:15px;flex:1}
.likeBtn{border:2.5px solid var(--ink);background:#fff;border-radius:999px;font-family:inherit;font-weight:900;font-size:15px;padding:5px 14px;cursor:pointer}
.likeBtn:active{transform:scale(.9)}
.subsWrap{margin-top:18px}
.subsRow{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 12px}
.subCard{flex:0 0 148px;background:#fff;border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
.subCard .si{height:110px;display:flex;align-items:center;justify-content:center;background:var(--paper2);border-bottom:3px solid var(--ink)}
.subCard .si img{max-width:88%;max-height:88%;object-fit:contain}
.subCard .sb{padding:7px 10px;font-size:11px;font-weight:900}
.subCard .sb .a{color:var(--ink2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subCard .sb .lk{display:flex;justify-content:flex-end;align-items:center;margin-top:3px}
.subCard .lk button{border:2px solid var(--ink);border-radius:999px;background:#fff;font-family:inherit;font-weight:900;font-size:11px;padding:1px 8px;cursor:pointer}

.familyRow{margin-top:44px}
.familyRow h3{font-size:20px;font-weight:900;margin-bottom:12px}
.fwords{display:flex;gap:10px;flex-wrap:wrap}
.fword{border:3px solid var(--ink);background:#fff;border-radius:999px;padding:7px 18px;font-weight:900;cursor:pointer;font-size:16px}
.fword:hover{background:var(--yellow)}
.backLink{display:inline-block;margin-bottom:14px;font-weight:900;color:var(--ink2);cursor:pointer}
.backLink:hover{color:var(--coral)}

/* 語根ページ:4つの斜め枠と、追加2つの外側水平枠 */
.rmLead{font-size:22px;font-weight:900;margin:4px 0 2px}
.rootMap{position:relative;container-type:inline-size;--rm-image:clamp(52px,9.8cqw,88px);--rm-node:clamp(68px,16cqw,144px);--rm-char:clamp(70px,22cqw,180px);width:100%;max-width:900px;height:clamp(390px,46vw,480px);margin:16px auto;isolation:isolate}
.rmLines{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:visible}
.rmCenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;text-align:center}
.rmConcept{position:absolute;left:50%;top:calc(100% + 12px);transform:translateX(-50%);width:max-content;max-width:calc(var(--rm-char)*1.2);font-size:clamp(13px,3.2cqw,38px);font-weight:900;line-height:1.25;color:var(--rc)}
.rmCharWrap{width:var(--rm-char);height:var(--rm-char);border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;overflow:visible;background:radial-gradient(circle at 50% 40%,#fff 8%,color-mix(in srgb,var(--rc) 22%,#fff) 100%);box-shadow:0 14px 30px rgba(36,31,38,.12)}
.rmChar{width:112%;height:112%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(36,31,38,.16))}
.rmRoot{font-family:"Shippori Mincho",serif;font-style:italic;font-weight:800;font-size:18px;color:var(--ink2)}
.wnode{position:absolute;left:var(--rm-x);top:calc(var(--rm-y) - var(--rm-image)/2);transform:translateX(-50%);z-index:1;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:none;padding:0;cursor:pointer;transition:filter .12s;width:var(--rm-node);max-width:none}
.wnode:hover{filter:brightness(1.03)}
.wnode[data-slot="upper-left"]{--rm-x:33%;--rm-y:18%}
.wnode[data-slot="upper-right"]{--rm-x:67%;--rm-y:18%}
.wnode[data-slot="lower-left"]{--rm-x:33%;--rm-y:77%}
.wnode[data-slot="lower-right"]{--rm-x:67%;--rm-y:77%}
.wnode[data-slot="middle-left"]{--rm-x:max(calc(var(--rm-node)/2 + 8px),18%);--rm-y:50%}
.wnode[data-slot="middle-right"]{--rm-x:min(calc(100% - var(--rm-node)/2 - 8px),82%);--rm-y:50%}
.wnImg{width:var(--rm-image);height:var(--rm-image);flex:0 0 auto;display:flex;align-items:center;justify-content:center;overflow:visible}
.wnImg img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(2.5px 3px 0 #00000022)}
.originSealSlot{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;width:max-content;pointer-events:none;z-index:2}
.originSeal{display:inline-block;white-space:nowrap;padding:1px 3px;background:var(--paper);color:var(--ink2);border:0;border-radius:3px;box-shadow:none;font-size:11px;font-weight:700;line-height:1.2;pointer-events:none}
.wnW{font-size:clamp(11px,1.8cqw,20px);font-weight:900;line-height:1.2;display:block;color:var(--ink);max-width:100%;overflow-wrap:anywhere}
.reg-G{background:#7a8b99}.reg-L{background:#c0693c}.reg-Gr{background:#3f7fae}
/* 古代概念チップ(語根構成)。個別ページ=大 / 辞典の行=小。
   アイコン未整備のキーはテキストピルで正式表記だけ出す */
.cchips{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cchips .cplus{font-weight:900;color:var(--ink2)}
.cchip{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:transform .12s}
.cchip:hover{transform:translateY(-3px)}
.cchip .ci{width:84px;height:84px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
.cchip .ci img{width:100%;height:100%;object-fit:contain}
.cchip small{font-size:13px;font-weight:900;color:var(--ink2);margin-top:2px}
.cchip.txt{border:2.5px solid var(--ink2);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:900;color:var(--ink2);background:#fff}
.cchip.sm .ci{width:46px;height:46px;border-width:2.5px;box-shadow:2px 2px 0 var(--ink)}
.cchip.sm small{display:none}
.cchip.txt.sm{padding:1px 8px;font-size:10px}
.cchips.sm{gap:4px;flex:0 0 auto}
.cchips.sm .cplus{font-size:10px}
/* 語派のはなしページ */
.drow .via{cursor:pointer}
.drow .via:hover{filter:brightness(1.12)}
.brLink{color:var(--coral);font-weight:900;cursor:pointer;white-space:nowrap}
.entryVia{font-size:12.5px;font-weight:900;color:#fff;border-radius:999px;padding:3px 15px;cursor:pointer;margin-left:10px;vertical-align:2px}
.entryVia:hover{filter:brightness(1.12)}
.grimmBox{background:var(--paper2);border:3px solid var(--ink);border-radius:18px;padding:16px 20px;margin:18px 0 26px;font-size:15px;font-weight:700;line-height:2}
.grimmBox.hasImg{position:relative;padding-left:158px}
.grimmWrap{position:absolute;left:22px;top:50%;transform:translateY(-50%);width:112px;text-align:center}
.grimmImg{display:block;width:112px;height:112px;object-fit:contain;filter:drop-shadow(2px 3px 0 rgba(36,31,38,.15))}
.grimmCap{display:block;margin-top:4px;font-size:11px;font-weight:900;color:var(--ink2)}
@media (max-width:640px){.grimmBox.hasImg{padding-left:20px;padding-bottom:140px}.grimmWrap{top:auto;bottom:12px;left:14px;transform:none}}
.grimmBox .gt{display:inline-block;background:var(--ink);color:#fff;font-size:13px;font-weight:900;border-radius:8px;padding:2px 12px;margin-bottom:6px;transform:rotate(-2deg)}
.grimmPairs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.gp{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 14px;display:flex;align-items:center;gap:9px;font-weight:900;box-shadow:2.5px 2.5px 0 var(--ink)}
.gp b{color:var(--ink2)}
.gpr{font-size:12px;color:var(--ink2)}
.gpw{font-size:12px;font-weight:900;color:#fff;border-radius:999px;padding:3px 12px;cursor:pointer}
.gpw:hover{filter:brightness(1.12)}
.gpw.plain{cursor:default}
.gpw.plain:hover{filter:none}
.fword.plain{cursor:default}
.brCard{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);padding:18px 22px;margin-bottom:18px;border-left:10px solid var(--bc)}
.brHero{margin:4px 0 22px}
.brKick{display:inline-block;background:var(--ink);color:#fff;font-size:13px;font-weight:900;border-radius:999px;padding:3px 16px;transform:rotate(-2deg);margin-bottom:10px}
.brTitle{font-size:clamp(26px,4.4vw,40px);margin-bottom:8px}
.brMinorHead{font-weight:900;font-size:20px;margin:30px 0 12px}
.brMinorGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;align-items:start}
.brCard.mini{padding:14px 18px;margin-bottom:0}
.brCard.mini .brBody{font-size:13.5px;line-height:1.9;margin-top:8px}
.brCard.mini .brHead .via{font-size:12px;padding:3px 12px}

/* 未登録エティモンのページ */

.etyCard{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--ink);padding:14px 10px;text-align:center}

/* 語根ページ:祖先→各単語(縦一列。単語どうしは絶対つなげない) */

.rootHero .rTitle{font-family:"Shippori Mincho",serif;font-style:italic;font-size:60px;font-weight:800}

.tree{margin-top:40px;--tw:4px}
.treeSeed{display:inline-flex;align-items:baseline;gap:10px;background:var(--rc);color:#fff;border:3px solid var(--ink);border-radius:20px;padding:12px 24px;box-shadow:5px 5px 0 var(--ink);font-family:"Shippori Mincho",serif;font-style:italic;font-size:28px;font-weight:800}

.branches{position:relative;margin-left:34px;padding-left:38px;margin-top:0}
/* 縦の幹:seed直下から最後の葉まで1本 */
.branches::before{content:"";position:absolute;left:0;top:-8px;bottom:32px;width:var(--tw);background:var(--ink);border-radius:99px}
/* 各葉は縦に積む。葉どうしは連結しない */
.leafRow{display:block;margin:14px 0}

.leaf::before{content:"";position:absolute;left:-38px;top:50%;width:38px;height:var(--tw);background:var(--ink);transform:translateY(-50%)}

/* 派生語辞典(地域タグ via はここに残す) */
.dictSec{margin-top:56px}

.drow .via{font-size:11px;font-weight:900;color:#fff;border-radius:999px;padding:2px 4px;flex:0 0 88px;text-align:center}

.via.G{background:#7a8b99}.via.L{background:#c0693c}.via.Gr{background:#3f7fae}
.drow .dj{flex:0 0 168px;min-width:0;font-size:15px;font-weight:900;line-height:1.6}
.drow .dl{font-size:13.5px;font-weight:700;color:var(--ink2);flex:1;line-height:1.8}

/* 派生語辞典: 現在の独自レベルごとの見出し */
.tierBox{border-bottom:2px dashed #e5dccb;border-left:6px solid var(--tc,transparent);background:color-mix(in srgb,var(--tc,#fff) 5%,#fff)}

.tierBox.t7{--tc:#6b4f1d;background:color-mix(in srgb,#6b4f1d 7%,#fff)}

.tierBox>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:13px 22px;font-weight:900}

.tierBox[open]>summary::after{transform:rotate(90deg)}
.tierBox[open]>summary{border-bottom:2px dashed #e5dccb}
.dictLegend{font-size:13px;font-weight:700;color:var(--ink2);margin:-8px 0 14px}

/* 古代概念アイコン=六千年前の意味を表す「印章」。キャラ(いまのマスコット)とは役割を分ける */

@media (max-width:980px){.rmMemo.hasSeal{padding-left:20px;padding-bottom:170px}.rmMemo .sealWrap{top:auto;bottom:14px;left:16px;transform:none}}
.via.Sa{background:#a0722d}.via.Ce{background:#4e8f6b}.via.Sl{background:#8a67c9}.via.Ir{background:#b0577a}

.step .no{position:absolute;top:-18px;left:-10px;width:52px;height:52px;border-radius:50%;background:var(--coral);color:#fff;font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);transform:rotate(-8deg)}
.step h3{font-size:21px;font-weight:900;margin-bottom:8px}

footer{padding:36px 0 46px;text-align:center;font-weight:700;color:var(--ink2);font-size:13.5px;line-height:2}

て、そこから先へ進んでいく場所である。だからこの語根は「先頭」も「いちばん大事なもの」も一手に引き受けた。英語に入った68語のうち52語がロマンス語派で、captain、chief、chef、capital と、ラテン語 caput が形を変えながら並び、ゲルマン語派の18語は head そのものの系統をなす。意外なのは cabbage「キャベツ」で、葉が巻いてできた「小さな頭」の意。precipitation「降水」にいたっては原義が「頭から真っ逆さま」で、雨が降る意味はあとから加わったものである。,kaput-,root-concept/root-kaput.png\nane,*ane-,息をする,#43b5a0,chara/T_ch_ane_breath.png,吸って吐く、その息づかい。この語根は息そのものを指し、やがて息をしているという事実が、命や心の意味まで引き受けた。英語に来た31語のうち18語はラテン語 anima(息、魂)経由で、animal(動物)は文字どおり「息をするもの」、unanimous(満場一致の)の「心がひとつ」の心も、たどれば息を表す語だ。ギリシャ語からは風を表す anemo- の形で入り、anemone(アネモネ)が咲いている。おもしろいのは anime(アニメ)で、英語の animation が日本で縮まり、1980年代に英語へ戻ってきた。,anə-,root-concept/root-ane.png\nbha,*bha-,話す,#f2a444,chara/T_ch_bha_speak.png,芯にあるのは、ただ音を出すことではなく、声に出して公に告げるという感覚だ。英語への道は二本あり、ラテン語経由が44語、ギリシャ語経由が41語とほぼ拮抗していて、ギリシャ側は -phone や -phony という音・声の顔つきで入ってきた。遠く離れて見えるのが fate(運命)で、その中身は神が口にしたこと、infant(幼児)はまだ話せない者を指す言い方だった。ban(禁止)もこの一族で、もとは声を張って布告することを意味した。語られた言葉が人の運命にも法にもなる、という重みがこの祖先には残っている。,bhā-2,root-concept/root-bha2.png\ngwei,*gwei-,生きる,#7cba62,chara/T_ch_gwei_live.png,息をして動いている、生き生きしている、という状態そのものがこの語根の芯にある。英語への道はギリシャ語派が最も太く55語で、bio- や zoo- の形をとる。ラテン語経由のロマンス語派35語は vita(生命)の一族で、vital(命にかかわる)、vitamin(命のアミン=ビタミン)、survive(生きのびる。sur- は「越えて」)と、語形から意味が透けて見える顔ぶれだ。意外なのはゲルマン語派に残った quick(速い)で、古英語では「生きている」を意味し、生き生きしていることがそのまま速さの意味に変わっていった。whiskey もこの一族で、ゲール語の「命の水」という言い回しを縮めた形だという。,gwei-,root-concept/root-gwei.png\noino,*oi-no-,ひとつ,#7f8ff0,chara/T_ch_oi-no_one.png,数の1というより、それきりで他にない、というひとりぼっちの感じが芯にある。英語ではゲルマン語派の26語がその感覚をそのまま担い、a も an も no も、もとをたどれば one が縮んだ姿である。一方ロマンス語派の38語はほとんどが uni- の顔で入り、17語がこの接頭辞を持つ。意外な身内は onion(タマネギ)で、幾重にも層が重なってなお一つの玉であることからこの名がついた。eleven(11)の中身は「10を取ってなお1つ残る」で、数え終えた指の先に余った1が、そのまま数の名になっている。,oi-no-,root-concept/root-oino.png\nreg,*reg-,まっすぐ導く,#5aa7e8,chara/T_ch_reg_straight.png,まっすぐであること、そしてまっすぐに導くこと。曲がりのない一本の線という感覚が、そのまま「正しい」にも「支配する」にも伸びたのがこの語根で、英語にはラテン語経由で110語、古英語のまま33語が入っている。rule(規則)はラテン語のregula、つまり「まっすぐな棒」のことで、線を引く定規と守るべき決まりが同じ一語に収まっている。意外なのはdress(ドレス)で、原義は「まっすぐにする」、つまり整えることであり、服を着せる意味が出てきたのは14世紀末になってからだった。rich(金持ちの)も同じ一族で、古英語では「強い、身分が高い」を指し、ケルト語の「王」を借りた語であって、豊かさとはもともと王のようであることだった。,reg-,root-concept/root-reg.png\nweid,*weid-,見る・知る,#a06ee0,chara/T_ch_weid_see.png,見ること、そして見たから知っていること。この語根では、目で捉えることと頭で分かっていることが地続きで、見た者がそのまま知る者だった。ラテン語 videre(見る)を通った vision(視覚)や view(眺め)はその直系。古英語のまま残ったのが wise(賢い)と wit(機知)で、見た者は知る者、知る者は賢い者だった。history(歴史)はギリシャ語で「見て知っている人の報告」のことで、物語の story はその頭が落ちただけの同じ語である。idol(偶像)ももとは「目に映っただけのもの」、つまり幻や亡霊を指した。アイドルと呼ばれる人も、語のうえでは「見えた姿」にすぎない。,weid-,root-concept/root-weid.png\nye,*ye-,投げる,#f26d99,chara/T_ch_ye_throw.png,手を離れたものが飛んでいく。この動作が芯にあり、どこへ投げるかによって意味が枝分かれした。61語のうち53語はロマンス語派で、ject という形をかかえ、前へ投げる、外へ投げる、投げ返すという具合に、接頭辞ごとに別の語になった。意外な身内は ease(容易さ)と、それを dis- で打ち消した disease(病気)で、こちらは「そばに横たわる」という楽な姿勢から来ている。subject が主題と臣民の両方を指すのは、原義が「下に投げられた者」だからである。,yē-,root-concept/root-ye.png\nmori,*mori-,水域,#46b8d8,chara/T_ch_mori_water.png,海だけを指す語根ではなく、水をたたえた広がりなら湖でも沼でもよかった。英語に来た32語のうち21語はラテン語 mare からで marine(海の)や submarine(潜水艦)の顔、9語はゲルマン語派を通って marsh(湿地)や mermaid(人魚)になった。mermaid は文字どおり「海の乙女」で、前半の mere は今は使われない「海」の古語だ。月の表面の黒い部分を mare と呼ぶのは、あれを本当に海だと思っていたころの名残である。いちばん意外なのは rosemary(ローズマリー)で、中身はラテン語の「海のしずく」であり、バラともマリアとも関係なく、あとから綴りがそちらへ寄っただけだ。,mori-,root-concept/root-mori.png\nmen,*men-,考える,#9b8bd8,chara/T_ch_men_think.png,心を働かせること、思い浮かべ、記憶にとどめておくことがこの祖先の芯にある。英語への道はギリシャ語経由が37語、ラテン語経由も37語と真っ二つで、ギリシャ側は -mania(狂)や -mancy(占い)という激しい顔つきで入ってきた。意外な同族が monster(怪物)で、もとは神が凶事を告げる前触れ、つまり人に思い起こさせる警告のことだった。music(音楽)も女神ムーサの技という意味で、同じ一族に属している。考えることと、狂うことと、神の声を聞くことが一つの祖先の下に同居しているのが面白い。,men-1,root-concept/root-men1.png\ndo,*do-,与える,#f0a64a,chara/T_ch_do_give.png,手にあるものを差し出して、相手のものにしてしまう。この語根の芯は、その受け渡しの一瞬にある。英語に来た68語のうち42語がロマンス語派で、add や donation のようにラテン語 dare の系統を作り、ギリシャ語派の18語は dose や antidote の顔で入った。意外なのは data「データ」で、原義は「与えられたもの」、計算の前提として差し出された事実のことだった。面白いのは tradition「伝統」と treason「反逆」が双子だということで、手渡すという同じ動作が、渡す相手が敵になったとたん裏切りの名になる。,dō-,root-concept/root-do.png\ngenu,*genu-,ひざ・角,#80b8ee,chara/T_ch_genu_angle.png,曲がっている場所そのものを指すのがこの語根で、体でいえば膝、図形でいえば角になる。ゲルマン語から直に来たのは knee(ひざ)を含む2語だけで、残る17語はギリシャ語派を通り、角を意味する gonia の顔で入っている  cwice(生き生きした)から。しぶとく生える雑草の名で、quick(もとは「生きた」)と同じ語である。,gwei-\noino,a,G,一つの,1,もとは one。an の n が子音の前で消えて a になった。,oi-no-\noino,an,G,一つの,1,a より古い、もとの形。古英語では「一つ」そのものだった。,oi-no-\noino,one,G,一つ,1,発音は本来「オーン」。only や alone に昔の音が残っている。,oi-no-\noino,only,G,唯一の,5,中身は one + like で「一つのような」。one の古い発音を今も残す。,oi-no-\noino,any,G,どんな〜でも,32,中身は one + y で「一つばかりの」。どんな一つでも、が出発点。,oi-no-\noino,another,G,別の,121,an + other が縮まった語。もとは「二つのうちの二つめ」。,oi-no-+al-1\noino,once,G,一度、かつて,191,one に副詞の -s がついた形。-ce の綴りは s の音を守るため。,oi-no-\noino,someone,G,だれか,237,もとは some one と二語だった。一語で書かれ出すのは19世紀半ば。,sem-1+oi-no-\noino,alone,G,ひとりで,263,all one(まったくひとり)の縮まった形。one の古い発音がここに残る。,al-5+oi-no-\noino,everyone,G,みんな,292,every は ever(いつも)+each(それぞれ)。それに one を足した語。,aiw-+līk-+oi-no-\noino,unit,L,単位、部隊,366,digit に似せて unity を作り変えた語。ユークリッド英訳で広まった。,oi-no-\noino,none,G,何ひとつない,381,ne(ない)+one(一つ)の合成。これが縮んで no になった。,ne+oi-no-\noino,unique,L,唯一の,385,原義は「ただ一つの」。「珍しい」の意味は19世紀の誤用から広まった。,oi-no-\noino,university,L,大学,434,原義はただの「団体」。「教師と学生の団体」を縮めた呼び名。,oi-no-\noino,anyway,G,とにかく,447,1830年代までは any way と、二語に分けて書かれていた。,oi-no-+wegh-\noino,universal,L,普遍的な,451,語源は「ひとつに向き直った」。全部が同じ方を向く姿。,oi-no-+wer-3\noino,universe,L,宇宙,470,unus(一つ)+vertere(向ける)で「ひとつに転じたもの」が原義。,oi-no-+wer-3\noino,anywhere,G,どこでも,475,14世紀末に any と where がくっついた新顔。古くは owhere。,oi-no-+kʷo-\noino,union,L,結合、組合,477,ラテン語 unio は「一粒の真珠」、そして「玉ねぎ」も指した。,oi-no-\noino,uniform,L,制服、一様な,482,「形が一つ」が原義。衣服を指すのは1748年、軍服から始まった。,oi-no-+merph-\noino,inch,L,インチ,495,もとはラテン語の「12分の1」。1フィートの12分の1だからこの名。,oi-no-\noino,unity,L,統一,509,もとは神学の語で、三位一体の「一つ」を指していた。,oi-no-\noino,nobody,G,だれも…ない、取るに足りない人,516,「取るに足りない人」の意は1580年代から。昔は二語で書いた。,ne+oi-no-\noino,eleven,G,11,563,語源は「ひとつ残る」。十を取り去ってなお一つ余る、の意。,oi-no-+leikʷ-\noino,lonely,G,孤独の、寂しい,579,1600年ごろは「ひとりの」だけの意。寂しさを帯びたのは1811年から。,oi-no-\noino,onion,L,タマネギ,628,ラテン語の「一つ」から。ニンニクと違い、層が重なって一つだから。,oi-no-\noino,nonlinear,L,非線形の,637,line の語根は「亜麻の糸」。麻ひもが「線」になった。,ne+lī̆no-+oi-no-\noino,nonsense,G,無意味な言葉,642,20世紀半ばから、ばかげた意でない場合はnon-senseと書き分ける。,ne+sent-+oi-no-\noino,null,L,無効の,657,中身は「一つもない」。ne「ない」と unus「一」からできた語。,ne+oi-no-\noino,ounce,L,オンス,679,ラテン語 uncia「12分の1」から。同じ語が inch にもなった。,oi-no-\noino,universally,L,普遍的に,681,語根は「一つ」+「回す」。すべてを一つに向けたのが universe。,oi-no-+wer-3\noino,lone,G,ひとりの,692,alone を縮めた語。もとは「まったく一つ」の意味だった。,oi-no-\noino,nonprofit,L,非営利の,702,non-(打ち消し)+ profit(利益)から。profit はラテン語 pro-(前へ)+ facere(なす)で、fact と同じ語である。,ne+per1+dhē-+oi-no-\noino,unite,L,結合する,705,語根は「一」。eleven は「十を取って一余る」から出た語。,oi-no-\noino,unilateral,L,一方的な,709,「片側だけ」が原義。法律で「一方だけが結ぶ」意に使ったのはベンサムらしい。,oi-no-\noino,anytime,G,いつでも,714,1語に固まったのは1854年ごろ。それまでは離して書いていた。,oi-no-+dā-\noino,uniformity,L,統一性,738,「同じ形」の意。単調でうんざりする含みは1700年ごろから。,oi-no-+merph-\noino,Angus,Ce,アンガス,740,古アイルランド語で「唯一の力」。牛の名になったのは1842年。,oi-no-+geus-\noino,unison,L,調和,742,もとは音楽の「同じ高さの音」。心が合う意は1640年代から。,oi-no-+swen-\noino,une,L,結合する,761,1400年ごろの語。ラテン語 unire「一つにする」がそのまま。,oi-no-\noino,reunion,L,再結合,764,もとは単に再び集まること。昔の仲間の集いの意は1820年から。,re-+oi-no-\noino,unification,L,統合,775,1849年に動詞 unify から作られた、意外に新しい語。,oi-no-+dhē-\noino,anyhow,G,どうせ,788,中身は any + how。1900年には any old how という強調形も。,oi-no-+kʷo-\noino,unanimous,L,満場一致の,792,直訳は「心が一つ」。その「心」は元をたどれば「息」を表す語。,oi-no-+anə-\noino,unicorn,L,一角獣,868,プリニウスいわく、馬の体に鹿の頭、象の足、獅子の尾を持つ。,oi-no-+ker-1\noino,unify,L,統一する,870,直訳は「一つに作る」。語尾 -fy は fact と同じ「作る」。,oi-no-+dhē-\noino,nonfiction,L,ノンフィクション,877,fiction の語根は「こねて形づくる」。こねていないほうがこの語。,ne+dheigh-+oi-no-\noino,no,G,一つも〜ない,884,「いいえ」の no とは別語。none が縮んだ形。ne＋one で「一つも無い」が中身。,ne+oi-no-\noino,unanimity,L,一致,918,ラテン語 unanimus は「心がひとつ」。一つ+息(animus)の形。,oi-no-+anə-\noino,noncompliance,L,不従順,920,語根は「満たす」。求めを満たさないことが「不従順」。,ne+kom+pelə-1+oi-no-\noino,atone,L,償う,929,at と one がくっついた語。one の古い発音がこの語にだけ残っている。,ad-+oi-no-\noino,nondescript,L,特徴がない,929,元は学術用語で「まだ記載されていない」の意。転じて平凡を指すようになった。,ne+de-+skrībh-+oi-no-\noino,nonchalant,L,無関心な,930,中身は「熱くならない」。calorie と同じ「熱」が隠れている。,ne+kelə-1+oi-no-\noino,apiece,G,各個に,935,もとは硬貨や商品の値を言う「a piece」。それが縮まって一語に。,oi-no-+kʷezd-\noino,anon,G,すぐに,940,「一つに」が原義で、本来は「即座に」。使われるうちに「そのうち」へずれた。,an-+oi-no-\noino,nullify,L,無効にする,983,直訳は「無にする」。null は ne と one が合わさった「一つもない」。,ne+oi-no-+dhē-\noino,triune,L,三者一体の,983,tri(三)+unus(一)をつないだだけの語。1630年代に作られた。,trei-+oi-no-\noino,nonchalance,L,無関心,986,語の中身は「熱くならない」。心が動かない様子をそのまま表す。,ne+kelə-1+oi-no-\noino,annul,L,無効にする,1003,ラテン語で「無に帰す」。null(無効)と同じ語からできている。,ad-+ne+oi-no-\noino,noncommittal,L,言質を与えない,1018,「身を預けない」。commit は「委ねる」で、それをしないという組み立てである。,ne+kom+mittere+oi-no-\noino,nonpartisan,L,党派心のない,1041,non-(打ち消し)+ partisan(党派の人)から。イタリア語 partigiano、ラテン語 pars(部分)で、part と同じ語である。,ne+perə-2+oi-no-\noino,nonce,G,その場限りの,1042,then anes(その一度)の区切りを間違えて生まれた語である。,oi-no-+to-\noino,unary,L,単項の,1062,ラテン語 unus(一)から。unit や one と同じ「一」の語である。,oi-no-\noino,Unicode,L,ユニコード,1089,uni-(ひとつ)と code の合成。万国共通の文字コードである。,oi-no-\noino,nondeterministic,L,非決定論の,1128,determine の否定形。determine は「境を決める」が元。,ne+de-+ter-+oi-no-\noino,nonentity,L,取るに足りない人,1150,entity(存在)の否定。entity は「あること」が元である。,ne+es-+oi-no-\noino,nonsectarian,L,無党派の,1219,non-(〜でない)と sectarian(宗派の)から。sect と同じ「従う」語。,ne+sekʷ-1+oi-no-\noino,Uniate,Sl,合同教会派,1240,ロシア語 uniyat(合同派)から。ラテン語 unus(一)で、one と同じ語。,oi-no-\noino,einkorn,G,ヒトツブコムギ,1271,ドイツ語で「ひと粒」。ein(1つ)と Korn(穀粒)から、one と corn の語。,oi-no-+gr̥ə-no-\noino,quincunx,L,五つ目型,1296,ラテン語で「12分の5」。もとは硬貨の単位で、その刻印の五つの点の並びが名になった。,oi-no-+penkʷe\noino,uncial,L,アンシアル書体,1309,ラテン語 uncia(12分の1)から。ounce や inch と同じ語である。,oi-no-\noino,nonpareil,L,比類ない,1311,フランス語で「並ぶものがない」。non-(〜でない)と pareil(等しい)から。,ne+perə-2+oi-no-\noino,nonsuit,L,訴えの却下,1317,non-(〜でない)と suit(訴え)から。訴えを退けること。,ne+oi-no-+sekʷ-1\noino,nonblocking,L,無閉塞,1341,non-(〜でない)と blocking から。詰まりのないことをいう。,ne+oi-no-\noino,Non-functional,L,非関数の,1350,non-(〜でない)と functional から。はたらきを持たないこと。,ne+bheug-2+oi-no-\noino,nonplused,L,当惑した,1435,ラテン語 non plus(これ以上ない)から。plus は plural や full と同じ「満たす」語である。,ne+pelə-1+oi-no-\noino,nonplus,L,途方に暮れること,1479,ラテン語 non plus(これ以上ない)から。plus は plural や full と同じ「満たす」語である。,ne+oi-no-+pelə-1\noino,nonjuror,L,宣誓拒否者,1545,non- とラテン語 jurare(誓う)から。jury や just と同じ「法」の語である。,ne+yewes-+oi-no-\noino,nullipara,L,未産婦,1551,ラテン語 nullus(ひとつもない)と parere(産む)から。null と parent を合わせた語である。,ne+oi-no-+perə-1\noino,nonuniversality,L,非普遍性,1648,non-(否定)と universality から。universe はラテン語 unus(1)と vertere(向く)による語である。,ne+oi-no-+wer-3\noino,zollverein,G,関税同盟,1755,ドイツ語 Zoll(関税)+ Verein(同盟)から。Zoll は英語 toll(通行料)と同じ語である。,oi-no-\noino,coadunate,L,癒合した,1765,ラテン語 coadunare(一つにまとめる)から。com-(共に)+ ad(…へ)+ unus(一)で、unite と同じ「一」の語である。,kom+ad-+oi-no-\noino,turnverein,G,体操協会,1790,ドイツ語 turnen(体操する)+ Verein(協会)から。Verein は ein(一)を含み、one と同じ「一」の語である。,oi-no-+per1\noino,nonrecursively,L,帰納的でなく,1849,non-(打ち消し)+ recursive から。ラテン語 currere(走る)にさかのぼり、current や occur と同じ「走る」語である。,ne+re-+kers-2+oi-no-\noino,indricothere,Gr,インドリコテリウム,2129,ロシア語 indrik(伝説の一角獣)+ ギリシャ語 thērion(獣)から。後半は treacle と同じ「野獣」の語である。,oi-no-+ghwer-\nreg,right,G,正しい、右、権利,83,原義は「まっすぐ、正しい」。方角の「右」は正しい手の側から。,reg-\nreg,rights,G,権利,255,語根は「まっすぐ」。まっすぐが「正しい」になり、やがて「権利」になった。,reg-\nreg,source,L,源,299,原義は「泉が湧き上がるところ」。sub(下から)+regere(導く)。,upo+reg-\nreg,direction,L,方向、指示,312,原義は「まっすぐ整えること」。方角を指すのは17世紀から。,dwis-+reg-\nreg,direct,L,導く、直接の,318,dis-(離れて)+regere(まっすぐ導く)で、まっすぐ差し向けること。,dwis-+reg-\nreg,region,L,地域、部位,320,語根は「まっすぐ導く・支配する」。線で区切った統治の範囲が原義。,reg-\nreg,rule,L,規則、定規,324,ラテン語 regula は「まっすぐな棒」。定規と規則は同じ語だった。,reg-\nreg,correct,L,正しい,333,もとは罰して正すこと。曲がったものをまっすぐにする、が原義。,kom+reg-\nreg,address,L,住所、演説,341,原義は「まっすぐ向ける」。ゴルフのアドレスに古い意味が残る。,ad-+reg-\nreg,rich,G,金持ちの、濃厚な,374,古英語では「強い、身分が高い」。ケルト語の「王」からの借用語。,reg-\nreg,regular,L,定期的な,403,最初は「修道会の戒律に従う」の意。語源はまっすぐな木の棒。,reg-\nreg,Richard,G,リチャード,405,古高ドイツ語で「統治に強い」の意。愛称形が Rick になった。,reg-+kar-\nreg,dress,L,ドレス,409,原義は「まっすぐにする」。服を着せる意味は14世紀末から。,de-+reg-\nreg,regional,L,地域の,422,region の祖先は「まっすぐ導く」。王の regal も同じ一族。,reg-\nreg,resource,L,資源、機転,435,原義は「もう一度立ち上がる」。尽きても湧き直すものが資源。,re-+upo+reg-\nreg,regulation,L,規則,439,もとは「整えること」という行為。「規則」の意は1715年から。,reg-\nreg,regime,L,政権,464,15世紀には「食事や運動の養生法」を指す語だった。,reg-\nreg,director,L,監督、取締役,472,最初はただの「案内人」。映画や舞台の「監督」の意は1911年から。,dwis-+reg-\nreg,regulatory,L,規制する,492,語根は「まっすぐ」。定規で引く直線が規則のもと。,reg-\nreg,royal,L,王の、ひどい,493,米語では1940年代から「ひどい」の強め言葉にもなった。,reg-\nreg,regularly ,古英語では「きちんと並べる」。並べて数えるから「計算」へ。,kom+reg-\nreg,reckless,G,無謀な,715,reck は「気にかける」意の古い動詞。今はこの語にだけ残る。,reg-+leu-\nreg,arrogant,L,傲慢な,716,語根は「手を差し出す」。自分のものだと求める姿が傲慢。,ad-+reg-\nreg,regulator,L,調整者,726,1767年の米国では、地方の自警団も regulator と呼ばれた。,reg-\nreg,Reich,G,ドイツ帝国,729,「まっすぐ導く」語根から。英語では1871〜1945年のドイツを指した。,reg-\nreg,directory,L,案内,731,もとは教会の手引き書。電話帳を指すのは1908年から。,dwis-+reg-\nreg,royalty,L,王族、印税,732,王の特権から転じて、本の印税もroyaltyと呼ぶようになった。,reg-\nreg,regimen,L,養生法、統治,738,語根は「まっすぐ導く」。養生法の意が先で、統治の意は後。,reg-\nreg,arrogance,L,傲慢,748,原義は「自分のものだと要求する」。手を差し出す動作が元。,ad-+reg-\nreg,rectangle,L,長方形,749,昔の英語では「long square(長い正方形)」と呼んだ。,reg-+ank-\nreg,enrich,L,質を高める、金持ちにする、同位体を濃縮する,760,原義は「金持ちにする」。1945年から、同位体を「濃縮する」意味でも使う。,en+reg-\nreg,surrogate,L,代理の、代理母,764,もとは司教や裁判官の代理を指した。代理母の意はずっと後。,upo+reg-\nreg,redress,L,矯正,772,中身は「再びまっすぐにする」。服の dress と同じ語を含む。,re-+reg-\nreg,Aubrey,L,オーブリー,779,人名。中身は「エルフの支配者」。米国では1973年ごろから女子名に。,albho-+reg-\nreg,insurrection,L,反乱,806,原義は「立ち上がること」。反乱とは文字どおり体を起こすことだった。,en+upo+reg-\nreg,outsourcing,L,外部調達,809,out(外へ)+ source(源)+ -ing から。source はラテン語 surgere(湧き上がる)で、surge と同じ語である。,ud-+reg-\nreg,prerogative,L,特権,810,ローマで最初に投票する権利を得た組のこと。順番はくじ引き。,per1+reg-\nreg,unruly,G,手に負えない,814,un が付く前の ruly「素直な」は消え、否定形だけが生き残った。,ne+reg-\nreg,anorexia,Gr,食欲不振,821,語根は「手をまっすぐ伸ばす」。伸ばす欲が無いのが原義。,ne+reg-\nreg,rectum,L,直腸,828,「まっすぐな腸」が原義。動物しか解剖しなかったガレノスの命名。,reg-\nreg,interrogate,L,尋問する,832,「尋ねる」を表すラテン語 rogare は、もと「手を差し伸べる」。,en+reg-\nreg,rectify,L,修正する,837,ラテン語で「まっすぐにする」。もとは病や行いを治すことを指した。,reg-+dhē-\nreg,Dietrich,G,ディートリッヒ,845,人名。原義は「民を治める者」。Derrick はこの名の変わり形。,teutā-+reg-\nreg,rake,G,くま手,850,語根は「まっすぐ」。まっすぐな木の歯を並べた道具の意とされる。,reg-\nreg,regal,L,威厳がある,862,語根は「まっすぐ引く」。まっすぐ導く者が王だった。,reg-\nreg,rector,L,牧師,863,元は「支配者」。神やローマ総督を指す語が18世紀に聖職者へ。,reg-\nreg,Roderick,G,ロデリック,868,「名声において統べる」の意。スペイン語のロドリゴも同じ名。,kar-2+reg-\nreg,derogatory,L,軽蔑的な,878,語源は「手を差し出して問う」。そこから値打ちを削り取る意味へ。,de-+reg-\nreg,resourceful,L,資源に富んだ、機転の利く,878,resource は「再び湧き上がるもの」。1807年には「抜け目ない」の意。,re-+upo+reg-\nreg,rectus,L,直筋,894,ラテン語で「まっすぐな」。rectangle と同じ語で、まっすぐ走る筋肉。 \nweid,video,L,映像、ビデオテープ,418,ラテン語で「私は見る」。1935年、audio にならって作られた語。,weid-\nweid,survey,L,調査、測量,422,原義は「上から見下ろす」。土地の測量に使われだしたのは1540年代。,uper+weid-\nweid,interview,L,面接、取材,424,取材の意は1869年の米国生まれ。原義は「互いに見る」。,en+weid-\nweid,visible,L,目に見える,424,「有名な、目立つ」の意で使われ出したのは1950年代から。,weid-\nweid,advice,L,助言,427,語源は「私にはこう見える」。ただの感想が忠告になった。,ad-+weid-\nweid,ideal,Gr,理想,431,名詞の「理想」は1796年、カントの翻訳から生まれた新顔。,weid-\nweid,wisdom,G,知恵,452,親知らずを「知恵の歯」と呼ぶのは1848年から。,weid-+dhē-\nweid,provision,L,供給、規定、食糧,454,原義は「先を見ること」。備えとは、未来を見通す力だった。,per1+weid-\nweid,evident,L,明らかな,461,ex(すっかり)+videre(見える)で、「まる見え」が原義。,eghs+weid-\nweid,witness,G,目撃者,464,原義は「知っていること」。知っている人が、そのまま証人に。,weid-\nweid,wise,G,賢い、やり方,474,語根は「見る」。よく見た者が知る者、つまり賢い者になった。,weid-\nweid,guidance,G,指導,476,学校や職業の「指導」を指すのは1927年から。案外新しい。,weid-+-nt-\nweid,television,Gr,テレビ,484,実物より先に名前ができた語。1907年、空想の技術に「遠くを見る」と命名。,kʷel-2+weid-\nweid,overview,G,概要,511,17世紀の「監督」の意は一度滅び、1934年に別語で復活。,uper+weid-\nweid,invisible,L,目に見えない,543,見えないインクの意は1680年代から。透明人間はウェルズの1897年。,ne+weid-\nweid,ideology,Gr,イデオロギー,549,もとは1796年生まれの「観念の科学」。今の意味は1907年ごろから。,weid-+leg-\nweid,provider,L,供給者,568,もとは「先を見通す」人。備えるとは、先を見ることだった。,per1+weid-\nweid,historic,Gr,歴史的な,577,historical の後ろを削って作られた語。使い分けは後からの整理。,weid-\nweid,likewise,G,同様に,582,もとはin like wiseという句。wiseは「やり方」の意の名詞。,līk-+weid-\nweid,historian,Gr,歴史家,589,古英語では wyrd-writere、「出来事を書きしるす人」と呼んだ。,weid-\nweid,historically,Gr,歴史的に,589,芯にあるのは「見る」。見て知っている人の語りが history になった。,weid-\nweid,righteous,G,正義の,612,古くは rightwise。語尾が courteous につられて -eous に化けた。,reg-+weid-\nweid,revision,L,校正、復習,636,「もう一度見る」が原義。英国では「復習」の意でも使われる。,re-+weid-\nweid,visualization,L,視覚化,636,1881年に「心に思い描くこと」の意で生まれた新しい語。,weid-\nweid,thyroid,Gr,甲状腺の,637,ギリシャ語で「扉形の盾」。ガレノスがのど仏をそう呼んだ。,dhwer-+weid-\nweid,visibility,L,視界、注目度,648,「視界」の意味は1914年から。「注目度」を指すのは1958年以降。,weid-\nweid,wit,G,ウィット,656,もとは「頭の働き」。おかしみを指すのは1540年代から。,weid-\nweid,advise,L,忠告する,657,もとは「私にはこう見える」という言い回し。d は後から入った字。,ad-+weid-\nweid,envy,L,ねたみ,672,原義は「悪意をもって見る」。ねたみは邪視のまなざしだった。,en+weid-\nweid,viewpoint,L,観点,677,1856年に現れた新しい語で、当時は俗な言い方とされた。,weid-+peuk-\nweid,disguise,L,変装させる,687,「装い」を変えるが原義。1560年代には「酔って人が変わる」意もあった。,dwis-+weid-\nweid,visually,L,視覚的に,693,ラテン語 videre(見る)から。vision や wise(賢い)と同じ「見る・知る」語に連なる。,weid-\nweid,ideally,Gr,理想的に,706,もとは「頭の中で」の意。「理想的に」は1840年からの意味。,weid-\nweid,visualize,L,思い浮かべる,708,1817年、詩人コールリッジが作ったらしい語。「心に見えるようにする」意。,weid-\nweid,prudent,L,慎重な,717,provident が縮まった形。原義は「先を見ている」。,per1+weid-\nweid,guideline,G,指針,731,1846年には気球を操る綱の意。比喩で使うのは1948年から。,weid-+lī̆no-\nweid,jurisprudence,L,法学,743,後ろ半分は prudence。原義は「法を見通す知」。,yewes-+per1+weid-\nweid,provisional,L,暫定的な,743,原義は「今の必要をまかなう」。だから間に合わせの意味に。,per1+weid-\nweid,visa,L,ビザ,762,「見られた紙」が語の中身。役人が目を通した証だった。,weid-\nweid,revise,L,改訂する,763,もとは「もう一度見る」だけ。直す意味は1590年代から。,re-+weid-\nweid,wizard,G,魔法使い,764,もとは「賢い人」。魔術師の意になったのは1550年ごろ。,weid-\nweid,idol,Gr,偶像,765,ギリシャ語では「幻」「亡霊」の意でもあった。,weid-\nweid,idealism,Gr,理想主義,778,1796年には「現実は観念だけでできている」という哲学の説だった。,weid-\nweid,guise,L,仮装,779,もとは「服装の流行」。見せかけの意味は1660年代から。,weid-\nweid,Hades,Gr,ハーデース,780,ギリシャ語 Haidēs から。冥界の神の名で、のちにその支配する冥界自体も指すようになった。,weid-\nweid,prudence,L,用心深さ,780,providence「先見」が縮んでできた語。用心とは先を見ることだった。,per1+weid-\nweid,visionary,L,洞察力のある,784,かつては「非現実的な」という悪口。今は先見の明をほめる語。,weid-\nweid,paranoid,Gr,偏執狂の,786,1901年に paranoia から不規則な形で作られた新しい語。,per1+weid-\nweid,steroid,Gr,ステロイド,786,中身は「sterol に似たもの」。1936年に作られた新しい語。,ster-1+weid-\nweid,providence,L,摂理,793,中身は「先を見ること」。神の摂理を指すのは1600年ごろから。,per1+weid-\nweid,reviewer,L,評者,795,1610年代には「校訂する人」。書評家の意味は1650年代から。,re-+weid-\nweid,prehistoric,Gr,先史時代の,802,1851年生まれの新しい語。フランス語をまねて作ったらしい。,per1+weid-\nweid,idolatry,Gr,偶像崇拝,803,分解すると「像を拝むこと」。像は本来ただの「見えるかたち」。,weid-+lē-1\nweid,supervise,L,監督する,809,「上から見る」がそのまま語に。監督の意味は1640年代から。,uper+weid-\nweid,improvised,L,即興の,827,分解すると「前もって見ていない」こと。だから即興になる。,ne+per1+weid-\nweid,envious,L,うらやましそうな,833,ラテン語 invidia(ねたみ)から。その語根は「見る」。,en+weid-\nweid,improvisation,L,即興,837,原義は「前もって見ていない」。即興演奏の名として1786年に登場。,weid-+ne+per1\nweid,preview,L,試写,841,もとは単に「先に見ておく」。映画の試写を指すのは1928年から。,per1+weid-\nweid,idealistic,Gr,理想主義の,855,idea の語根は「見る」。心に見えたものを信じる態度のこと。,weid-\nweid,purview,L,権限,861,法令の冒頭句「かく定める」が名詞になった語。綴りは view に引かれた。,per1+weid-\nweid,asteroid,Gr,小惑星,873,「星のような姿」という意味で、1802年に天文学者が作った新語。,ster-2+weid-\nweid,idyllic,Gr,牧歌的な,876,語根は「見る」。目に映る姿を表す語から出て、idol と同源。,weid-\nweid,vide,L,参照せよ,884,ラテン語「見よ」の命令形。q.v. の v はこの語の頭文字。,weid-\nweid,Veda,Sa,ベーダ,899,サンスクリット語で「知識」。英語の wise と同じ語根。,weid-\nweid,Ayurveda,Sa,アーユルヴェーダ,901,インドの伝統医学。名は「いのちの知識」で、後半は聖典 Veda と同じ語。,aiw-+weid-\nweid,visage,L,顔,905,原義は「見え方」。かつては「作り顔」という意味もあった。,weid-\nweid,proviso,L,条件,911,法律文書の冒頭にあったラテン語「…を条件として」がそのまま名詞に。,per1+weid-\nweid,vista,L,展望,915,イタリア語の「眺め」。並木道の奥に開ける長い景色を指した。,weid-\nweid,improvise,L,即興で作る,929,中身は「予見されない」。備えを打ち消した形が、そのまま即興を表す。,ne+per1+weid-\nweid,visor,L,面頬、帽子のひさし,931,語源はラテン語の「顔」。顔を隠す板が、やがて帽子のひさしに。,weid-\nweid,tabloid,Gr,タブロイド,943,もとは薬の錠剤の商標名。「圧縮された」が転じて短い記事の新聞に。,weid-\nweid,kaleidoscope,Gr,万華鏡,969,直訳は「美しい形を見るもの」。1817年に発明者が名づけた語。,kal-2+weid-+spek-\nweid,penguin,Ce,ペンギン,973,もとは北の海のオオウミガラスの名。南極の鳥に移ったのは1580年代。,weid-\nweid,Gwendolyn,Ce,グウェンドリン,975,人名。名の頭は「白い」。もとをたどれば「よく見える」という意味だった。,weid-\nweid,imprudent,L,軽率な,979,中身は「先が見えていない」。prudent は providens が縮んだ形。,ne+per1+weid-\nweid,wot,G,知っている,986,「知る」を意味する古語 wit の活用形。God wot は「神のみぞ知る」。,weid-\nweid,unwitting,G,無意識の,991,中身は「知らないでいる」。1600年ごろすたれ、1800年ごろ復活。,ne+weid-\nweid,ovoid,L,卵形の,992,ラテン語の「卵」にギリシャ語の「…のような」を継いだ混成語。,awi-+weid-\nweid,Vedanta,Sa,ベーダーンタ学派,996,名は「ヴェーダの終わり」。聖典の締めくくり、奥義という意味。,weid-+ant-\nweid,scaphoid,Gr,舟状の,1006,ギリシャ語で「舟の形の」。手首にある、あの小さな骨の名である。,(s)kep-+weid-\nweid,clairvoyant,L,千里眼の,1024,フランス語で「はっきり見える」。clear と see を合わせた組み立てである。,kelə-2+weid-\nweid,clairvoyance,L,千里眼,1033,フランス語で「はっきり見えること」。clear と see を合わせた組み立てである。,kelə-2+weid-\nweid,invidious,L,いまいましい,1042,ラテン語で「にらみつける」。envy と同じ「見る」語である。,en+weid-\nweid,provident,L,先見の明のある,1047,ラテン語で「前もって見る」。provide と同じ語である。,per1+weid-\nweid,pterygoid,Gr,翼状骨,1048,「翼の形をした」。頭蓋の奥にある、翼を広げたような形の骨を指す。,pet-+weid-\nweid,idyll,Gr,田園詩,1052,ギリシャ語で「小さな姿」。idol と同じ「見た形」の語である。,weid-\nweid,druid,L,ドルイド,1054,ケルト語の「樫を知る者」。木を通して神意を読んだ祭司たちの呼び名である。,deru-+weid-\nweid,ethmoid,Gr,篩骨の,1057,ギリシャ語で「ふるいのような」。穴だらけの鼻の骨のこと。,sē-3+weid-\nweid,kaleidoscopic,Gr,万華鏡の,1066,ギリシャ語で「美しい形を見る」。三語を並べた造語である。,kal-2+weid-+spek-\nweid,purveyor,L,調達人,1072,purvey(調達する)から。provide と同じ語である。,per1+weid-\nweid,outwit,G,裏をかく,1073,out と wit の合成。知恵で相手の外に出る、という言い方。,ud-+weid-\nweid,sternocleidomastoid,Gr,胸鎖乳突筋,1083,ギリシャ語 sternon(胸骨)+ kleis(鎖骨)+ mastoeidēs(乳頭状の)から。胸骨と鎖骨から乳様突起へ走る筋の意である。,sterə-+klāu-+weid-\nweid,cricoid,Gr,環状の,1091,ギリシャ語の「輪のような」。circle と同じ「回す」語。,(s)ker-3+weid-\nweid,idealize,L,理想化する,1105,ideal から。idol と同じ「見た形」の語である。,weid-\nweid,voyeur,L,詮索好き,1106,フランス語で「見る人」。のぞき見をする側だけを名指しした語である。,weid-\nweid,coracoid,Gr,烏口骨,1114,ギリシャ語で「カラスのくちばしのような」。肩甲骨の突起の形からついた名。,ker-2+weid-\nweid,witless,G,愚かな,1118,wit(知恵)が無いこと。wit は「見て知る」が元である。,weid-+leu-\nweid,wizardry,G,魔術,1120,wizard から。wizard は wise(賢い)に由来する語である。,weid-+kar-\nweid,eidetic,Gr,はっきりと目に浮ぶ,1130,ギリシャ語の「見た形」。idol と同じ「見る」語である。,weid-\nweid,improvident,L,先見の明がない,1155,provident の否定。provide と同じ「前もって見る」語。,ne+per1+weid-\nweid,twit,G,なじる,1157,古い atwite(なじる)の頭が落ちた形。wit と同じ「見る」語。,ad-+weid-\nweid,advisement,L,相談,1158,advise から。vision と同じ「見る」語である。,weid-+ad-\nweid,idolize,Gr,崇拝する,1181,idol(偶像)に -ize がついた語。idol はもと「見えるもの、姿」の意。,weid-\nweid,anthropoid,Gr,人間に似た,1189,ギリシャ語で「人のような」。anthropos(人)と -oid から。,weid-\nweid,witticism,L,機知に富んだ言葉,1189,witty(機知に富む)と criticism を合わせた造語。wit と同じ語である。,weid-\nweid,idolater,Gr,偶像崇拝者,1192,ギリシャ語で「像に仕える者」。姿かたちを意味する語から出ている。,weid-+lē-1\nweid,sarcoid,Gr,肉の,1211,ギリシャ語 sarx(肉)から。sarcasm と同じ「切り裂く」語につながる。,twerk-+weid-\nweid,prevision,L,予見,1226,ラテン語で「前もって見ること」。vision と同じ語である。,weid-+per1\nweid,eidolon,Gr,幻,1227,ギリシャ語 eidolon(姿、幻)から。idol と同じ語である。,weid-\nweid,cycloid,Gr,サイクロイド,1236,ギリシャ語で「輪のような」。cycle と同じ語である。,kʷel-1+weid-\nweid,aneroid,Gr,液体を用いない,1286,ギリシャ語で「液体を使わない」。否定の a- と neron(水)から。,ne+newo-+weid-\nweid,deja vu,L,既視感,1288,フランス語で「すでに見た」。後半は vision と同じ「見る」語である。,weid-\nweid,eicosanoid,Gr,不飽和脂肪酸,1308,ギリシャ語 eikosi(20)から。炭素20個の脂肪酸を指す。,wīkm̥tī+weid-\nweid,wite,G,非難,1318,古英語 witan(責める)から。wit(知る)と同じ語である。,weid-\nweid,belvedere,L,望楼,1324,イタリア語で「よい眺め」。見晴らしのために建てた高い部屋を指す。,deu-2+weid-\nweid,purvey,L,調達する,1331,古フランス語 porveeir(前もって備える)から。provide と同じ語である。,per1+weid-\nweid,witting,G,承知の上の,1348,古英語 witan(知っている)から。wit(知る)と同じ語である。,weid-\nweid,guy,L,張り綱,1352,男の人を指すふつうの guy とは別語。guide と同じ語で、もとは「導くもの」。テントを支える綱。,weid-\nweid,Rig-Veda,Sa,リグ=ベーダ,1357,サンスクリット語で「賛歌の知識」。veda(知識)は wit と同じ語。,erkʷ-+weid-\nweid,placoid,Gr,板のような,1388,ギリシャ語 plax(板)から。板のようなうろこをいう。,plāk-1+weid-\nweid,wiseacre,G,知ったかぶりをする人,1416,中期オランダ語 wijssegger(予言者)から。wise と同じ語で、acre(畑)とは関係がない。,weid-\nweid,guidon,L,部隊旗,1424,フランス語 guidon(旗じるし)から。guide と同じ語で、wise や view と同じ「見る」根である。,weid-\nweid,hadal,L,超深海(帯)の,1445,ギリシャ神話の冥界 Hades から。「見えない」の意とされ、深海帯をいう。,weid-\nweid,ctenoid,Gr,櫛のような歯のある,1458,ギリシャ語 kteis(くし)と eidos(形)から。eidos は idol や wise と同じ「見る」語である。,pek-2+weid-\nweid,ganoid,Gr,硬鱗魚類の,1492,ギリシャ語 ganos(輝き)と eidos(形)から。eidos は idol や wise と同じ「見る」語である。,gāu-+weid-\nweid,plerocercoid,Gr,擬尾虫,1520,ギリシャ語 pleres(満ちた)と kerkos(尾)から。pleres は full や plus と同じ語である。,pelə-1+weid-\nweid,colcannon,Ce,コルカノン,1522,アイルランド語の「白い頭のキャベツ」から。芋とキャベツを潰した料理のこと。,weid-\nweid,ophiuroid,Gr,クモヒトデ,1553,ギリシャ語 ophis(ヘビ)と oura(尾)から。ophidian と同じ「ヘビ」の語である。,ogʷhi-+ors-+weid-\nweid,iwis,G,確かに,1555,古英語 gewiss(確かに)から。wit や wise と同じ「知る」語である。,kom+weid-\nweid,witenagemot,G,賢人会議,1621,古英語で「賢人たちの集まり」。アングロサクソン時代の助言会議のこと。,kom+mōd-+weid-\nweid,idocrase,Gr,ベスブ石,1635,ギリシャ語 eidos(形)と krasis(混合)から。idol と crater と同じ語である。,weid-+kerə-\nweid,polyhistor,Gr,博学者,1635,ギリシャ語 poly(多い)と histor(知る者)から。history や wise と同じ「見る・知る」語である。,pelə-1+weid-\nweid,autacoid,Gr,オータコイド,1688,ギリシャ語 autos(自分)と akos(薬)から。auto- と panacea と同じ語である。,autos+yēk-+weid-\nweid,black-a-vised,L,色黒の,1766,black + 古フランス語 vis(顔)で「黒い顔つきの」。vis はラテン語 visus(見ること)、visage や vision と同じ語である。,bhel-1+ad-+weid-\nweid,previse,L,予知する,1817,ラテン語 praevidere(前もって見る)から。prae-(前に)+ videre(見る)で、provide や vision と同じ「見る」語である。,per1+weid-\nweid,lumbricoid,L,ミミズ状の,1886,ラテン語 lumbricus(ミミズ)+ -oid(…状の)から。回虫の学名 Ascaris lumbricoides のもとになった語である。,slengʷh-+weid-\nweid,strophoid,Gr,ストロフォイド,1903,ギリシャ語 strophos(ねじった帯)+ -oid(…状の)から。catastrophe と同じ「回す」語である。,streb(h)-+weid-\nweid,sciaenoid,Gr,ニベ科の魚、ニベ科の,2299,ギリシャ語 skiaina(ニベの類の魚)から。skia(影)にさかのぼるとされ、shine と同じ語に連なる。,skai-2+weid-\nye,subject,L,主題、被験者,266,原義は「下に投げられた者」。支配される臣民が、いつしか文の主語に。,upo+yē-\nye,disease,L,病気,274,ease「楽」を dis- で打ち消した語で、もとは「不快、不便」だった。,dwis-+yē-\nye,project,L,計画、投影する,285,原義は「前に投げ出されたもの」。投影も計画も「投げる」から。,per1+yē-\nye,object,L,物体、反対する,324,「前に投げ出されたもの」が原義。だから「反対する」の意味も持つ。,epi+yē-\nye,objective,L,目標、客観的な,411,1610年代の意味は今とほぼ逆で、「心に思い描かれた」だった。,epi+yē-\nye,ease,L,容易さ、和らげる,485,原義は「そばに横たわる」。寝そべる姿がそのまま「楽」になった。,ad-+yē-\nye,adjacent,L,隣接した,544,物にだけ使い、人や動物には使わない語。接していなくてよい。,ad-+yē-\nye,subjective,L,主観的な,544,1500年ごろは「従順な」の意。心の中の意味はカント以後に広まった。,upo+yē-\nye,injection,L,注射,548,原義は「中へ投げ込む」。体に液を送り込む意は15世紀から。,en+yē-\nye,rejection,L,拒絶、拒絶反応,561,原義は「投げ返すこと」。臓器の拒絶反応の意は1954年から。,re-+yē-\nye,reject,L,拒絶する,586,原義は「投げ返す」。求愛をはねつける意は1580年代から。,re-+yē-\nye,trajectory,L,軌道,603,ラテン語で「投げ渡す」。投げたものが描く線が「軌道」。,terə-2+yē-\nye,projection,L,投射,614,もとは錬金術の語。溶けた金属に粉を投げ入れて変成させること。,per1+yē-\nye,objection,L,異議,620,中身は「前に投げる」。ラテン語では「前に置くこと」だった。,epi+yē-\nye,jet,Gr,噴出,625,原義は「投げる」。勢いよく飛び出す水の意から、ジェット機まで来た。,yē-\nye,catheter,Gr,カテーテル,660,字義は「下ろされたもの」。体内へ落とし込む管、という名。,kat-+yē-\nye,uneasy,L,不安な,677,昔は暴君や着心地の悪い服にも使った。心が乱れる意は1400年頃。,ne+ad-+yē-\nye,adjective,L,形容詞,728,原義は「名詞に投げ添えられたもの」。ひとりでは立てない語。,ad-+yē-\nye,objectivity,L,客観性,735,カント哲学を英語で紹介するために生まれた1794年の新語。,epi+yē-\nye,conjecture,L,推量する,768,原義は事実を「一緒に投げ集める」こと。並べてみて当てを付ける。,kom+yē-\nye,inject,L,注入する,821,分解すると「中へ投げ入れる」。1600年ごろ、医学の言葉として英語に入った。,en+yē-\nye,abject,L,みじめな,839,原義は「投げ捨てられた」。中英語では「追放された者」も指した。,apo-+yē-\nye,projectile,L,発射体,839,中身は「前へ投げる」。大砲の弾を指す語として1660年代に登場。,per1+yē-\nye,objectionable,L,不愉快な,857,「反対に投げつける」が objection の原義。異議を投げられそうな、の意。,epi+yē-\nye,malaise,L,不快感,876,文字どおり「悪い ease」。フランス語から来た、はっきりしない不調。,mel-5+ad-+yē-\nye,projector,L,プロジェクター,877,1590年代は「企画する人」の意味だった。映写機を指すのは1884年から。,per1+yē-\nye,gist,L,主旨,881,法廷の言い回し「この訴えはここにある」の「ある」が名詞になった。,yē-\nye,jetty,L,突堤,925,フランス語の「投げる」から。周りより先へ投げ出された構造物、の意。,yē-\nye,ejaculat erotomania,Gr,色情狂,1429,ギリシャ語 eros(愛)と mania(狂気)から。mania は mind や mental と同じ語である。,erə-3+men-1\nmen,bibliomania,Gr,蔵書癖、書物狂,1481,ギリシャ語 biblion(本)+ mania(熱狂)から。bible と、mind や mental と同じ「心」の語からなる。,men-1\nmen,Mazdaism,Ir,ゾロアスター教,1511,アヴェスタ語 Mazda(知恵)から。mind や mental と同じ「考える」語である。,men-1+dhē-\nmen,oneiromancy,Gr,夢占い,1533,ギリシャ語 oneiros(夢)と manteia(占い)から。necromancy と同じ語尾である。,oner-+men-1\nmen,dement,L,ぼける,1542,ラテン語 de-(離れて)と mens(心)から。mental や mind と同じ「考える」語である。,men-1\nmen,amentia,L,アメンチア,1546,ラテン語で「心を離れて」。精神の働きが失われた状態を指した古い医学語である。,apo-+men-1\nmen,monish,G,警告する,1590,ラテン語 monere(いさめる)から。admonish や mind と同じ「考えさせる」語である。,men-1\nmen,cleromancy,Gr,くじによる占い,1593,ギリシャ語 kleros(くじ)と manteia(占い)から。clergy や necromancy と同じ語である。,kel-1+men-1\nmen,minnesinger,G,ミンネジンガー,1603,ドイツ語 Minne(愛)と Singer(歌い手)から。Minne は mind、singen は sing と同じ語である。,men-1+sengʷh-\nmen,minikin,G,小さい,1616,中期オランダ語 minneken(いとしい人)から。minne(愛)は mind と同じ語である。,men-1\nmen,ament,L,知的障害のある人,1621,「心が離れた」の意。ラテン語の a「離れて」と mens「心」から。,men-1\nmen,balletomane,Gr,バレエ狂の人,1669,ロシア語 balet(バレエ)と mania(狂気)から。ballet と mania を合わせた語である。,gʷelə-+men-1\nmen,rhabdomancy,Gr,棒占い,1730,ギリシャ語 rhabdos(杖)と manteia(占い)から。rhabdos は verse と同じ「巻く」根である。,wer-3+men-1\nmen,gebrauchsmusik,G,実用音楽,2020,ドイツ語 Gebrauch(使用)+ Musik(音楽)で「実用音楽」。前半は英語 brook(耐える。もとは「用いる」)と同じ語である。,bhrūg-+men-1\ndo,data,L,データ,112,「与えられたもの」datum の複数形。もとは計算の前提となる事実。,dō-\ndo,addition,L,追加,279,ad-「〜へ」+ dare「与える」で、原義は「加え与えること」。,ad-+dō-\ndo,date,Gr,日付、デート,332,ローマ人が手紙の末尾に書いた「与えられた日」から。,dō-\ndo,traditional,L,伝統的な,335,語源は「手渡す」。人から人へ渡されてきたものが伝統になる。,terə-2+dō-\ndo,additional,L,追加の,347,additional の add は、ラテン語の「〜へ与える」から。,dō-+ad-\ndo,add,L,加える,362,ad(〜へ)+dere(置く)。「そばに置く」が「加える」になった。,ad-+dō-\ndo,die,G,さいころ、金型,371,死ぬ die とは別語。ラテン語「与えられたもの」から。,dō-\ndo,tradition,L,伝統,411,trans(越えて)+dare(与える)で、原義は「手渡すこと」。,terə-2+dō-\ndo,dose,Gr,服用量,458,原義はギリシャ語の「与えること」。医師が処方する量を指した。,dō-\ndo,edition,L,版,463,ex(外へ)+dare(与える)で、原義は「世に出すこと」。,eghs+dō-\ndo,editor,L,編集者,523,1640年代は「出版者」。今の「編集者」の意は1712年から。,eghs+dō-\ndo,rent,L,家賃,526,「裂け目」の re function parseCSV(text){
  const rows=[];let row=[],cur="",q=false;
  text=text.replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(cur);cur="";}
      else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur="";if(row.length>1||row[0]!=="")rows.push(row);row=[];}
      else cur+=c;}}
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  const head=rows.shift()||[];
  return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h.trim(),(r[i]??"").trim()])));
}
async function loadCSV(name){
  try{
    const res=await fetch(DATA_BASE+name,{cache:"no-store"});
    if(res.ok) return parseCSV(await res.text());
  }catch(e){}
  if(EMB_CSV[name]) return parseCSV(EMB_CSV[name]);
  return [];
}

   EMB_IMG は単体HTMLを配る場合だけのフォールバックであり、ここで優先すると
   assets/word の差し替えが画面へ反映されなくなる。 */
function imgURL(path){
  if(!path) return "";
  const selected=window.ETYMOPEDIA_CHARACTER_IMAGES?.aliases?.[path];
  if(selected)return ASSET_BASE+selected.path+'?v='+selected.sha256;
  if(path.startsWith("data:")||path.startsWith("http")) return path;
  return ASSET_BASE+encodeURI(path)+"?v="+ASSET_VERSION;
}

  const noted=roots.find(([,m])=>text.includes(`${(m.t||"").toLowerCase()}(`)||text.includes(`${(m.t||"").toLowerCase()}（`));
  if(noted)return [noted[0]];
  const fallback={kaput:"cap",ane:"anim",bha:"phon",gwei:"viv",oino:"one",reg:"rect",weid:"vid",ye:"ject",mori:"",men:"mon",do:"don",genu:"gon"}[rootId];
  return fallback&&MORPHS[fallback]?[fallback]:[];
}
function parseLexMorphNote(rootId,note){
  if(!note||!note.includes("+"))return [];
  return note.split("+").map(raw=>{
    const m=raw.trim().match(/^([A-Za-z0-9_-]+)\s*[\(（]([^）)]*)[\)）]/);
    if(!m)return "";
    return morphIdForLexToken(rootId,m[1],m[2]);
  }).filter(Boolean);
}
function morphIdForLexToken(rootId,token,meaning){
  const t=(token||"").toLowerCase().replace(/[^a-z0-9_-]/g,"");
  if(t==="in"&&/(否定|not|negative|無|非)/i.test(meaning||""))return MORPHS.in_neg?"in_neg":"in";
  if(MORPHS[t])return t;
  const exact=Object.entries(MORPHS).find(([,mo])=>(mo.t||"").toLowerCase()===t);
  if(exact)return exact[0];
  const sameRoot=Object.entries(MORPHS).find(([,mo])=>mo.root===rootId&&((mo.t||"").toLowerCase().startsWith(t)||t.startsWith((mo.t||"").toLowerCase())));
  if(sameRoot)return sameRoot[0];
  return "";
}
function lexSplitFor(word,morphs){
  if(!morphs||!morphs.length)return [word,""];
  const mo=morphOf(morphs[0]);
  const t=(mo.t||"").toLowerCase();
  const lower=(word||"").toLowerCase();
  if(morphs.length>1&&!morphIsRoot(morphs[0])&&t&&lower.startsWith(t)){
    return [word.slice(0,t.length),word.slice(t.length)];
  }
  if(t&&lower.startsWith(t))return [word.slice(0,t.length),word.slice(t.length)];
  return [word,""];
}

async function loadAll(){
  const [ui,roots,morphs,words,lex,subs,concepts,branches]=await Promise.all(
    ["ui.csv","roots.csv","morphs.csv","words.csv","lexicon.csv","submissions.csv","concepts.csv","branches.csv"].map(loadCSV));
  ui.forEach(r=>UI[r.key]=r.value);
  Object.assign(UI,{"site_title": "ワイルドワードピア", "site_sub": "英単語の祖先ずかん", "nav_roots": "ワイルド", "nav_words": "単語をさがす", "hero_h1_a": "英単語の<span class='draw'>祖先</span>が、", "hero_h1_b": "いきものになった。", "stat_roots_label": "ワイルド", "stat_words_label": "収録単語", "words_head": "単語ずかん", "words_sub": "ワイルドから生まれた英単語。キャラをタップすると家系図へ。", "footer": "<b>ワイルドワードピア</b> ― 英単語の祖先ずかん"});
  roots.forEach(r=>ROOTS[r.id]={r:r.root,jp:r.jp,c:r.color,art:r.art,note:r.note,concept:r.concept||"",pie:r.pie||""});
  for(const [id,item]of Object.entries(window.ETYMOPEDIA_CHARACTER_IMAGES?.roots||{})){if(ROOTS[id])ROOTS[id].art=item.path;}
  /* 語根構成の台帳(concepts.csv)。key=エティモン探索の正式キー */
  concepts.forEach(c=>CONCEPTS[c.key]={disp:c.disp,jp:c.jp,en:c.en||"",icon:c.icon,reg:c.reg});
  BRANCHES=branches;
  morphs.forEach(m=>MORPHS[m.id]={t:m.text,m:m.meaning,root:m.root||null,icon:m.icon||""});
  WORDS=words.map(r=>({w:r.w,root:r.root,split:[r.split_a,r.split_b],
    morphs:(r.morphs||"").split("|").filter(Boolean),ipa:r.ipa,pos:r.pos,jp:r.jp,gloss:r.gloss,memo:r.memo,
    region:r.region||"",p:(r.p||"").split("+").filter(Boolean),
    ex:(r.ex_en||r.ex_ja)?{en:r.ex_en,ja:r.ex_ja}:null}));
  LEXICON={};
  lex.forEach(r=>{(LEXICON[r.root]??=[]).push([r.w,r.via,r.jp,r.note,(r.p||"").split("+").filter(Boolean)]);});
  SUBS={};
  // byId(WORDS + 辞書のみの語も簡易ページ化)
  byId={};WORDS.forEach(w=>byId[w.w]=w);
  Object.entries(LEXICON).forEach(([rootId,arr])=>arr.forEach(([w,via,jp,note,pl])=>{
    if(byId[w])return;
    const morphs=inferLexMorphs(rootId,w,note);
    // note はエティモン探索の語源メモ(それ自体が完結した一文)なので、そのまま語源メモ欄へ
    byId[w]={w,root:rootId,split:lexSplitFor(w,morphs),morphs,ipa:"",pos:"",jp,gloss:jp,memo:note||lexMemoFor(w,jp,note),region:via||"",p:pl||[],lexOnly:true,ex:lexExampleOf(w)};
  }));
  try{
    LEVELS=await EtymopediaLearning.load();
    LEVELS.apply(WORDS,LEXICON,ROOTS,byId);
    window.etymopediaLevels=LEVELS;
  }catch(error){console.warn("Current word data unavailable",error);}
  window.etymopediaWord=(word,roots)=>{
    const entry=byId[word];
    if(entry&&JSON.stringify(entry.p||[])===JSON.stringify(roots))return entry;
    for(const rows of Object.values(LEXICON))for(const [w,via,jp,note,p] of rows)if(w===word&&JSON.stringify(p||[])===JSON.stringify(roots))return {w,jp,p};
    return null;
  };
  /* 共有の learning-levels.js は語根ページの描画を「言語ハブ+曲線」版に差し替える。
     この図鑑では分岐のないまっすぐな線を使うので、差し替え後に元へ戻す。 */
  const ownRenderRoot=renderRoot,ownDrawRootLines=drawRootLines;
  window.drawRootLines=null;   // 差し替え処理は drawRootLines が無いと何もしない
  EtymopediaLearning.bind();
  window.renderRoot=ownRenderRoot;window.drawRootLines=ownDrawRootLines;
}

function wordRootIds(w){

/* ---- 古代概念チップ(正式な語根構成) ----

const approvedWordArt=new Map(Object.entries(globalThis.ETYMON_WORD_ART||{}).map(([key,stem])=>{

}

/* ---- 語根ページ:キャラ中心の放射状マップ ---- */
function renderRoot(id){
  const r=ROOTS[id];if(!r){location.hash="";return;}
  const lex=LEXICON[id]||[];
  const seen=new Set();
  const candidates=[
    ...WORDS.filter(w=>w.root===id),
    ...lex.map(([w])=>byId[w]).filter(Boolean)
  ].filter(w=>{
    if(!w||seen.has(w.w))return false;
    seen.add(w.w);
    return true;
  });
  // Select only exact canonical identities named in the current PIE explanation.
  // Missing level, unresolved sense, or missing approved image means no filler.
  const list=LEVELS?LEVELS.rootExamples(r.pie,r.note,candidates,source=>approvedWordArt.has(wordArtSenseKey(source.w,source.p))):[];
  /* 起源言語ごとにまとめ、左右へ均等に振り分ける。線は祖先から各語へまっすぐ同じ太さで引く。
     分岐点や曲線は使わない(順番や時系列があるように見せないため。時系列のデータは無い)。 */
  const escapeLabel=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const placed=list.map(w=>{const source=LEVELS.source(w);const stem=source&&approvedWordArt.get(wordArtSenseKey(source.w,source.p));if(!stem)return null;
    const labels=(source.origin_sticker_languages||source.origin_languages||[]);
    return {w,img:imgURL("word/"+stem+".png"),lang:labels.join('・')||regionLabel(w.region)||'起源未確認'};}).filter(Boolean);
  const groups=[];for(const p of placed){let g=groups.find(x=>x.lang===p.lang);if(!g)groups.push(g={lang:p.lang,items:[]});g.items.push(p);}
  groups.sort((a,b)=>b.items.length-a.items.length);
  const cap=[Math.ceil(placed.length/2),Math.floor(placed.length/2)],cols=[[],[]];
  for(const g of groups){let items=g.items.slice();
    while(items.length){const side=(cap[0]-cols[0].reduce((s,z)=>s+z.items.length,0))>=(cap[1]-cols[1].reduce((s,z)=>s+z.items.length,0))?0:1;
      const room=cap[side]-cols[side].reduce((s,z)=>s+z.items.length,0);const take=items.splice(0,Math.max(1,room));cols[side].push({lang:g.lang,items:take});}}
  const langColor=l=>/ラテン|フランス|ロマンス|イタリア|スペイン/.test(l)?"#c0693c":/ギリシャ/.test(l)?"#3f7fae":/英語|ゲルマン|ノルド|オランダ|ドイツ/.test(l)?"#56758f":/サンスクリット|インド/.test(l)?"#a0722d":/ケルト/.test(l)?"#4e8f6b":"#8a8494";
  const nodeHTML=p=>`<button class="wnode" style="--rc:${r.c}" onclick="location.hash='#/word/${encodeURIComponent(p.w.w)}'"><span class="wnImg"><img src="${p.img}" alt="" onerror="this.closest('.wnode').remove();drawRootLines()"></span><span class="wnT"><span class="wnW">${p.w.w}</span><small class="wnJ">${(p.w.jp||"").split("、")[0]}</small></span></button>`;
  const colHTML=(zones,side)=>`<div class="rmCol rm-${side}">${zones.map(z=>`<div class="rmZone" style="--zc:${langColor(z.lang)}"><span class="rmLang">${escapeLabel(z.lang)}</span><div class="rmZoneWords">${z.items.map(nodeHTML).join("")}</div></div>`).join("")}</div>`;
  const drowHTML=([w,via,jp,note,pl])=>{
    const canonicalRoots=LEVELS&&LEVELS.pieRoots({w,jp,p:pl});
    const art=topArt(w,pl);
    const img=art?art.img:imgURL(`word/${w}.png`);
    return `<div class="drow" onclick="location.hash='#/word/${w}'">
      <span class="dthumb"><img src="${img}" alt="" loading="lazy" onerror="this.src='${imgURL(PLACEHOLDER_ART)}'"></span>
      <span class="dw">${w}<small class="dwj">${jp}</small></span>${canonicalRoots?conceptRowHTML(canonicalRoots,true):'<span class="canonical-hold">組立照合待ち</span>'}<span class="dl">${note}${LEVELS&&LEVELS.status({w,jp,p:pl}).status!=="matched"?`<small class="canonical-hold">正本との照合待ち・更新保留</small>`:""}</span></div>`;
  };
  // 独自レベルの値ごとにまとめる。照合できない語は推測せず別枠に置く。
  const dict=[...Array.from({length:10},(_,i)=>i+1),null].map(t=>{
    const arr=lex.filter(([w,via,jp,note,p])=>wordLevel({w,jp,p})===t);
    if(!arr.length)return "";
    const theme=EtymopediaLearning.theme(t);
    return `<details class="tierBox t${theme}" open><summary>${levelPill(t)}<span class="tCount">${arr.length}語</span></summary>${arr.map(drowHTML).join("")}</details>`;
  }).join("");
  $("#view").innerHTML=`
    <span class="backLink" onclick="location.hash=''">← もどる</span>
    <div class="rmLead">「<b style="color:${r.c}">${r.jp}</b>」から生まれた英単語たち</div>
    <div class="rootMap" style="--rc:${r.c}">
      <svg class="rmLines" aria-hidden="true"></svg>
      ${colHTML(cols[1],'left')}
      <div class="rmCenter">
        <div class="rmCharWrap"><img class="rmChar" src="${imgURL(r.art)}" alt=""></div>
        <div class="rmConcept">${r.jp}</div>
      </div>
      ${colHTML(cols[0],'right')}
    </div>
    ${placed.length?'<p class="rmNote">囲みの色は、英語に入る前に通ってきた言語。線の長さや並び順に意味はありません。</p>':''}
    <div class="rmMemo"><span class="mt">語源メモ</span><span class="rmRootNote"><i>${r.r}</i></span><br>${r.note}</div>
    <div class="dictSec"><h3>派生語辞典(${lex.length}語)</h3>
      <div class="dictLegend">語源の組み立て</div>
      <div class="dictList">${dict||'<div class="drow"><span class="dl">(準備中)</span></div>'}</div></div>`;
  requestAnimationFrame(drawRootLines);
  setTimeout(drawRootLines,320);   // フォント確定後に引き直し
}

/* 祖先(キャラ)の円のふちから、各単語の絵の手前まで、まっすぐな線を同じ太さで引く。単語どうしはつながない */
function drawRootLines(){
  const map=$(".rootMap");if(!map)return;
  const svg=map.querySelector(".rmLines"),cw=map.querySelector(".rmCharWrap");if(!svg||!cw)return;
  const mr=map.getBoundingClientRect(),cb=cw.getBoundingClientRect();
  const cx=cb.left+cb.width/2-mr.left,cy=cb.top+cb.height/2-mr.top,cr=cb.width/2+4;
  svg.setAttribute("viewBox",`0 0 ${mr.width} ${mr.height}`);svg.style.width=mr.width+"px";svg.style.height=mr.height+"px";
  let p="";
  map.querySelectorAll(".wnode").forEach(node=>{
    const b=node.querySelector(".wnImg").getBoundingClientRect(),left=b.left+b.width/2<cx+mr.left;
    const ex=(left?b.right+4:b.left-4)-mr.left,ey=b.top+b.height/2-mr.top;
    const dx=ex-cx,dy=ey-cy,len=Math.hypot(dx,dy)||1,sx=cx+dx/len*cr,sy=cy+dy/len*cr;
    p+=`<line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="#241f26" stroke-width="2.5" stroke-linecap="round"/><circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="3.5" fill="#241f26"/>`;
  });
  svg.innerHTML=p;
}
addEventListener("resize",()=>{if($(".rootMap"))drawRootLines();});
addEventListener("load",()=>{if($(".rootMap"))drawRootLines();});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if($(".rootMap"))drawRootLines();});
// Image/font/layout changes must keep the connector attached to the visible node.
const rootLineObserver=new ResizeObserver(()=>{if($(".rootMap"))drawRootLines();});
rootLineObserver.observe($("#view"));
document.addEventListener('load',e=>{if(e.target.matches?.('.rmChar,.wnImg img'))drawRootLines();},true);

/* ---- 未登録エティモンのページ ----
   12体のエティモン以外の祖先(語根・接辞)はここに集まる。
   辞典・個別ページの古代概念チップをタップすると該当カードへスクロール */
function etyCardId(k){return "ety-"+[...k].map(c=>/[a-z0-9]/i.test(c)?c:"_"+c.codePointAt(0)).join("");}
function renderEtymons(hl){
  const list=Object.entries(CONCEPTS).filter(([,c])=>!c.reg);
  list.sort((a,b)=>a[1].disp.localeCompare(b[1].disp));
  $("#view").innerHTML=`
    <span class="backLink" onclick="location.hash=''">← もどる</span>
    <div class="rmLead">まだ登録されていない<b>祖先</b>たち</div>
    <div class="etySub">単語の分解に姿を見せる語根・接辞のうち、まだワイルドになっていない祖先たち(全${list.length})。</div>
    <div class="etyGrid">${list.map(([k,c])=>`
      <div class="etyCard${k===hl?" hl":""}" id="${etyCardId(k)}" title="${c.disp}「${c.jp}」">
                <div class="ed">${c.disp}</div><div class="ej">${c.jp}</div>
      </div>`).join("")}</div>`;
  if(hl){const el=document.getElementById(etyCardId(hl));if(el)setTimeout(()=>el.scrollIntoView({block:"center",behavior:"smooth"}),120);}
}

/* ---- 語派のはなし(バッジ→蘊蓄ページ。グリムの法則など音の変化の解説) ---- */
const BR_COLORS={G:"#7a8b99",L:"#c0693c",Gr:"#3f7fae",Sa:"#a0722d",Ce:"#4e8f6b",Sl:"#8a67c9",Ir:"#b0577a"};
function wordChip(w){
  // 収録語はリンク付き。未収録でも例として見せる(語派ページはサイトの
  // 収録語に縛られず、いちばんわかりやすい定番例を出す方針)
  if(byId[w])return `<span class="fword" onclick="location.hash='#/word/${w}'">${w}</span>`;
  return `<span class="fword plain">${w}</span>`;
}
function renderBranches(){
  const pairs=(UI.br_grimm_pairs||"").split(";").filter(Boolean).map(x=>x.split("|"));
  const pairHTML=([lab,a,b])=>{
    const va=byId[a]?byId[a].region||"L":"L", vb=byId[b]?byId[b].region||"G":"G";
    const go=w=>byId[w]?` onclick="location.hash='#/word/${w}'"`:"";
    return `<div class="gp"><span class="gpr">${lab}</span>
      <span class="gpw via ${viaCls(va)}${byId[a]?"":" plain"}"${go(a)}>${a}</span><b>⇄</b>
      <span class="gpw via ${viaCls(vb)}${byId[b]?"":" plain"}"${go(b)}>${b}</span></div>`;
  };
  const card=(br,mini)=>`
    <div class="brCard${mini?" mini":""}" style="--bc:${BR_COLORS[br.code]||"#888"}">
      <div class="brHead"><span class="via ${br.code}">${br.name}</span><span class="brCatch">${br.catch}</span></div>
      <div class="brBody">${br.body}</div>
      ${br.sound?`<div class="brSound"><b>音の見どころ</b>${br.sound}</div>`:""}
      <div class="brEx">${br.ex.split("|").map(wordChip).join("")}</div>
    </div>`;
  const MAJOR=["G","L","Gr"];
  const majors=BRANCHES.filter(b=>MAJOR.includes(b.code)).map(b=>card(b,false)).join("");
  const minors=BRANCHES.filter(b=>!MAJOR.includes(b.code)).map(b=>card(b,true)).join("");
  $("#view").innerHTML=`
    <span class="backLink" onclick="location.hash=''">← もどる</span>
    <div class="brHero">
      <span class="brKick">${UI.br_kick||"語派のはなし"}</span>
      <div class="rmLead brTitle">${UI.br_head||"同じ祖先、べつの道"}</div>
      <div class="etySub">${UI.br_sub||""}</div>
    </div>
    ${majors}
    <div class="grimmBox hasImg"><span class="grimmWrap"><img class="grimmImg" src="${imgURL(UI.br_grimm_img||PLACEHOLDER_ART)}" alt="" onerror="this.closest('.grimmWrap').remove()"><span class="grimmCap">${UI.br_grimm_cap||"グリム兄弟"}</span></span><span class="gt">${UI.br_grimm_t||"グリムの法則"}</span>
      <div>${UI.br_grimm_b||""}</div>
      <div class="grimmPairs">${pairs.map(pairHTML).join("")}</div></div>
    <div class="brMinorHead">${UI.br_minor_head||"もっと遠くの親戚たち"}</div>
    <div class="brMinorGrid">${minors}</div>`;
}

/* ---- ルーター ---- */
function route(){
  const h=location.hash;const mW=h.match(/^#\/word\/(.+)$/),mR=h.match(/^#\/root\/(.+)$/),mE=h.match(/^#\/etymons(?:\/(.+))?$/),mB=h.match(/^#\/branches(?:\/(.+))?$/);
  if(mW||mR||mE||mB){$("#home").style.display="none";$("#viewSec").style.display="block";
    if(mW)renderWord(decodeURIComponent(mW[1]));
    else if(mR)renderRoot(decodeURIComponent(mR[1]));
    else if(mE)renderEtymons(mE[1]?decodeURIComponent(mE[1]):"");
    else renderBranches();
    try{scrollTo({top:0})}catch(e){}}
  else{$("#viewSec").style.display="none";$("#home").style.display="block";}
}
addEventListener("hashchange",route);

/* ---- 起動 ---- */
(async()=>{
  await loadAll();
  $("#searchInput").addEventListener("input",e=>{
    if(location.hash.startsWith("#/"))location.hash="";
    renderWordGrid(e.target.value);
    document.getElementById("words").scrollIntoView({behavior:"smooth"});
  });
  renderHome();
  route();
})();
</script>
