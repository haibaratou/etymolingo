<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ec">
  <title>Pictlingo Quest</title>
  <meta name="description" content="絵を見て、英単語をなぞってつなぐ。正解した単語はずかんに登録。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%232c5146'/%3E%3Cg fill='%23f4bf9f'%3E%3Cellipse cx='32' cy='22' rx='8' ry='13'/%3E%3Cellipse cx='32' cy='42' rx='8' ry='13'/%3E%3Cellipse cx='22' cy='32' rx='13' ry='8'/%3E%3Cellipse cx='42' cy='32' rx='13' ry='8'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='6' fill='%23f8edbc'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="pictlingo-quest/quest.css?v=10">
  <script src="pictlingo-quest/quest-data.js?v=2" defer></script>
  <script src="picture-words/gesture.js" defer></script>
  <script src="pictlingo-quest/quest.js?v=10" defer></script>
</head>
<body>
<svg class="icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5V4Zm4 4c2 2 2 6 0 8m3-11c4 4 4 10 0 14"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5V4Zm5 5 6 6m0-6-6 6"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 6h3c5 0 7 12 12 12h3m-4-4 4 4-4 4M3 18h3c1.6 0 3-1.3 4.3-3.2M14 8.9C15.3 7.1 16.5 6 18 6h3m-4-4 4 4-4 4"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M8 17c0-4-3-3.8-3-8a7 7 0 0 1 14 0c0 4.2-3 4-3 8H8Zm1 4h6m-3-7V9m-2 0 2 2 2-2"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5C9 3 5 3 2 4v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-3-1-7-1-10 1v15"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
</svg>
<div id="app">

  <!-- ホーム：あそぶ / ずかん -->
  <section id="home" class="screen">
    <header class="bar">
      <div class="brand"><span class="mark">✿</span><b>Pictlingo</b></div>
      <button class="icon-btn" id="soundBtn" type="button" aria-label="音声と効果音をオフ" aria-pressed="true"><svg><use href="#i-sound"/></svg></button>
    </header>
    <main class="home-main">
      <div class="view" id="viewPlay"></div>
      <div class="view" id="viewDex" hidden></div>
    </main>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="Play" aria-selected="true"><svg><use href="#i-play"/></svg>あそぶ</button>
      <button type="button" role="tab" data-tab="Dex" aria-selected="false"><svg><use href="#i-book"/></svg>ずかん</button>
    </nav>
  </section>

  <!-- プレイ：なぞってつなぐ -->
  <section id="play" class="screen" hidden>
    <header class="bar play-bar">
      <button class="icon-btn" id="quitBtn" type="button" aria-label="やめる"><svg><use href="#i-close"/></svg></button>
      <div class="play-level" id="playLevel"></div>
      <div class="play-count" id="playCount" aria-live="polite"></div>
    </header>
    <div class="stage" id="stage">
      <figure class="picture" id="picture"><img id="pic" alt="" draggable="false"></figure>
      <p class="meaning" id="meaning"></p>
      <div class="slots" id="slots" aria-label="答えのマス"></div>
      <div class="board-wrap" id="boardWrap">
        <div class="board" id="board" role="group" aria-label="なぞって答える文字盤">
          <svg class="trail" id="trail" aria-hidden="true"><polyline id="trailLine"/></svg>
          <div class="tiles" id="tiles"></div>
        </div>
      </div>
      <div class="done" id="done" hidden></div>
    </div>
    <footer class="actions" id="actions">
      <button type="button" class="act" id="mixBtn"><svg><use href="#i-shuffle"/></svg><span>まぜる</span></button>
      <button type="button" class="act listen" id="listenBtn" aria-label="単語の発音を聞く"><svg><use href="#i-sound"/></svg><span>聞く</span></button>
      <button type="button" class="act" id="hintBtn"><svg><use href="#i-bulb"/></svg><span>答え</span></button>
    </footer>
  </section>

</div>
<dialog class="modal" id="modal"><button class="icon-btn m-close" id="mClose" type="button" aria-label="閉じる"><svg><use href="#i-close"/></svg></button><div id="mIn"></div></dialog>
<noscript>このゲームで遊ぶには JavaScript を有効にしてください。</noscript>
</body>
</html>
