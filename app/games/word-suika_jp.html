function drawBowlFloor(){
  ctx.save();

function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle="rgba(255,255,255,.2)";for(let y=120;y<H;y+=62){ctx.fillRect(0,y,W,1)}drawBowlFloor();ctx.setLineDash([8,8]);ctx.strokeStyle=dangerFrames?"#e94f68":"rgba(41,35,45,.28)";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,88);ctx.lineTo(W,88);ctx.stroke();ctx.setLineDash([]);
  const previewCh=mode==="choice"?(queue[choiceIndex]||queue[0]):queue[0];ctx.strokeStyle="rgba(41,35,45,.42)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(aimX,0);ctx.lineTo(aimX,Math.min(H,205));ctx.stroke();ctx.save();ctx.shadowColor="rgba(41,35,45,.28)";ctx.shadowBlur=0;ctx.shadowOffsetY=7;ctx.beginPath();ctx.arc(aimX,61,55,0,Math.PI*2);ctx.fillStyle="#fff7cf";ctx.fill();ctx.shadowColor="transparent";ctx.lineWidth=5;ctx.strokeStyle="#29232d";ctx.stroke();ctx.fillStyle="#29232d";ctx.font=`1000 ${previewCh?.length>1?26:60}px system-ui`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText((previewCh||"").toUpperCase(),aimX,63);ctx.restore();
  bodies.forEach(drawBody);drawChainSequence();particles.forEach(p=>{ctx.globalAlpha=Math.min(1,Math.max(0,p.life));if(p.label){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot||0);ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`1000 ${p.size}px system-ui`;ctx.lineWidth=7;ctx.strokeStyle="#fff";ctx.strokeText(p.label,0,0);ctx.fillStyle="#29232d";ctx.fillText(p.label,0,0);ctx.restore()}else{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size||4,0,Math.PI*2);ctx.fill()}});ctx.globalAlpha=1;if(burstFlash){ctx.fillStyle=`rgba(255,245,155,${burstFlash*.48})`;ctx.fillRect(0,0,W,H)}if(burstLabel){const a=Math.min(1,burstLabel.life*4),bw=Math.min(W-28,430),bh=118,bx=(W-bw)/2,by=Math.max(118,H*.25);ctx.save();ctx.globalAlpha=a;ctx.beginPath();ctx.roundRect(bx,by,bw,bh,22);ctx.fillStyle="rgba(255,255,255,.95)";ctx.fill();ctx.lineWidth=5;ctx.strokeStyle="#29232d";ctx.stroke();ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="#e67623";ctx.font="1000 16px system-ui";ctx.fillText(burstLabel.title,W/2,by+20);ctx.fillStyle="#29232d";ctx.font=`1000 ${Math.min(44,bw/9)}px system-ui`;ctx.fillText(burstLabel.word,W/2,by+59);ctx.fillStyle="#6e6070";ctx.font="850 16px system-ui";ctx.fillText(burstLabel.ja,W/2,by+94);ctx.restore()}}
function loop(now){const dt=now-last;last=now;if(!over)physics(dt);draw();requestAnimationFrame(loop)}
function showStageClear(b){if(over)return;over=true;stageCleared=true;const lastStage=stage>=STAGES.length;$("#resultTitle").textContent=lastStage?"ALL CLEAR!":`STAGE ${stage} CLEAR!`;$("#result").textContent=`${b.label}（${b.ja||"和訳なし"}） ／ ${score}点`;$("#again").textContent=lastStage?"最初から":"次のステージ";$("#over").classList.add("on")}
function gameOver(){if(over)return;over=true;stageCleared=false;$("#resultTitle").textContent=`STAGE ${stage} 失敗`;$("#result").textContent=`${wordCount}語を完成　${score}点`;$("#again").textContent="同じステージを再挑戦";$("#over").classList.add("on")}
function updateStageDisplay(){const s=currentStage(),goal=`${s.goal}字`;stageEl.textContent=stage;goalEl.textContent=goal;stageInfoEl.textContent=`STAGE ${stage}・${s.goal}文字でクリア`}
function reset(){clearTimeout(stageClearTimer);stageClearTimer=0;clearTimeout(stageIntroTimer);stageIntroTimer=0;stageIntro.classList.remove("on");clearTimeout(toastTimer);toast.classList.remove("on","new");bodies=[];particles=[];queue=[];stageCursor=0;stageProgress=0;score=0;wordCount=0;dangerFrames=0;burstFlash=0;burstLabel=null;wordChain=null;over=false;stageCleared=false;canDrop=false;choiceIndex=0;prepareStageTarget();scoreEl.textContent=0;$("#over").classList.remove("on");logEl.textContent=mode==="choice"?"候補を選んで、落とす位置をタップ":"好きな横位置をタップして落とす";updateStageDisplay();refillQueue();renderQueue();if(mode)showStageIntro()}

canvas.addEventListener("pointermove",e=>{const r=canvas.getBoundingClientRect();aimX=Math.max(57,Math.min(W-57,e.clientX-r.left))});canvas.addEventListener("pointerdown",e=>{e.preventDefault();const r=canvas.getBoundingClientRect();dropAt(e.clientX-r.left)});$("#reset").onclick=reset;$("#again").onclick=continueAfterResult;
