<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>エティモリンゴ 古代ことば図鑑</title>
<style>
:root{
  --ink:#241f26;
  --muted:#6f6673;
  --paper:#fffdf8;
  --card:#ffffff;
  --accent:#ff5470;
  --gold:#ffd23e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 18% 12%, #ffd23e55 0 18%, transparent 19%),
    radial-gradient(circle at 88% 8%, #ff547044 0 14%, transparent 15%),
    linear-gradient(180deg,#fffdf8 0%,#fff3e2 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 18px;
}
main{
  width:min(100%,520px);
  background:var(--paper);
  border:3px solid var(--ink);
  border-radius:28px;
  box-shadow:8px 8px 0 var(--ink);
  padding:28px 20px 24px;
}
.badge{
  display:inline-block;
  background:var(--ink);
  color:#fff;
  font-weight:900;
  font-size:13px;
  letter-spacing:.06em;
  border-radius:999px;
  padding:6px 12px;
  margin-bottom:16px;
}
h1{
  font-size:clamp(30px,8vw,44px);
  line-height:1.15;
  letter-spacing:.02em;
  margin-bottom:10px;
}
p{
  color:var(--muted);
  font-weight:700;
  line-height:1.8;
  margin-bottom:22px;
}
.links{display:grid;gap:14px}
a{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  min-height:82px;
  padding:18px 18px;
  color:var(--ink);
  text-decoration:none;
  background:var(--card);
  border:3px solid var(--ink);
  border-radius:20px;
  box-shadow:4px 4px 0 var(--ink);
  transition:transform .12s,box-shadow .12s,background .12s;
}
a:active{
  transform:translate(3px,3px);
  box-shadow:1px 1px 0 var(--ink);
}
a:hover{background:#fff8d8}
.title{font-size:20px;font-weight:900;line-height:1.25}
.desc{display:block;margin-top:4px;color:var(--muted);font-size:13px;font-weight:700;line-height:1.45}
.arrow{
  flex:0 0 auto;
  width:38px;height:38px;
  border-radius:50%;
  background:var(--gold);
  border:2px solid var(--ink);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;
}
@media (min-width:700px){
  main{padding:34px 30px 30px}
}
</style>
</head>
<body>
<main>
  <span class="badge">ETYMO-LINGO</span>
  <h1>エティモリンゴ<br>古代ことば図鑑</h1>
  <p>すべて制作途中の開発データです。<br>
    試作のゲームは非公開の作業場へ移しました。</p>
  <nav class="links" aria-label="リンク">
    <a href="etymopedia.html">
      <span><span class="title">エティモペディア</span><span class="desc">英単語のはじまりを読む図鑑</span></span>
      <span class="arrow">→</span>
    </a>
    <a href="ja-dict.html">
      <span><span class="title">日本語辞書</span><span class="desc">ことばの意味と成り立ちを引く</span></span>
      <span class="arrow">→</span>
    </a>
  </nav>
</main>
</body>
</html>
